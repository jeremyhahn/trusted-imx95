# platform-image/manifest.lock: the pins `make platform-image-fetch` checks
# out (scripts/platform-image-fetch.sh; docs/platform-image/build.md).
#
# Provisional default, pending the owner's answer on #14 (Q2 a): NXP's BSP
# manifest imx-6.18.37-2.1.0.xml, every layer at the commit the manifest
# gives, the same BSP release system-manager/sm.lock and secure-world/bsp.lock
# pin. key=value lines; the script and the test parse them, never source them.
# Every hash below was read from its source on 2026-11-21 (the manifest file,
# and git ls-remote for the layers the manifest names by tag, peeled to the
# commit); none is typed by hand. A layer that could not be read would carry
# the commit MISSING and a reason; none does.

# The manifest repository, the tag lf-6.18.37-2.1.0 (peeled) and its file.
manifest_repo=https://github.com/nxp-imx/imx-manifest
manifest_tag=lf-6.18.37-2.1.0
manifest_commit=0c44ab18abe471b4326037b61893f4e69b6fc182
manifest_file=imx-6.18.37-2.1.0.xml

# The machine, as meta-imx-bsp's conf/machine/imx95-19x19-lpddr5-frdm-pro.conf
# and system-manager/sm.lock name it.
machine=imx95-19x19-lpddr5-frdm-pro

# One block per project of the manifest: layer_<name>_repo, _path (relative to
# the fetch directory, as the manifest's path), _ref (only where the manifest
# names a tag rather than a commit) and _commit.
