# trusted-imx95: the headless distribution of the FRDM-IMX95-PRO image.
# Provisional default, pending the owner's answer on #14 (Q3 b): our own
# distro configuration derived from an fsl-imx-* distro, here NXP's
# framebuffer-minimal one (meta-imx-sdk), stripped to headless.
# Not built yet: no bitbake run has used this file.
#
# This file does not sign, and holds no key: AHAB signing is a separate step
# after the build (#14 Q4 b; docs/boot-container/signing-pipeline.md).
#
# Yocto's reproducible-build defaults and the SPDX 3.0 SBOM stay on, as they
# are (reproducible-build-survey sections 3 and 4, question 5 (a)): nothing
# here sets the epoch, the root filesystem timestamp or the SBOM class.

require conf/distro/poky.conf

# NXP's fsl-imx-fb-minimal.conf is not required: at the lock's meta-imx commit
# (the head of its wrynose-6.18.37-2.1.0 branch) it sets
# DISTRO_FEATURES_DEFAULT:remove, which oe-core wrynose rejects as obsolete.
# What this image needs from NXP's fsl-imx-base.inc is carried over here:

# MISSING: no survey covers it; carried over from NXP's fsl-imx-base.inc: meta-imx and meta-freescale select recipes by the "fsl" override.
DISTROOVERRIDES = "fsl"
# MISSING: no survey covers it; carried over from NXP's fsl-imx-base.inc: the i.MX95 tuning.
DEFAULTTUNE:mx95-nxp-bsp ?= "armv8-2a-crypto"
# MISSING: no survey covers it; carried over from NXP's fsl-imx-base.inc: the meta-virtualization, meta-security and meta-tpm layers
# are in the layer set; skip their sanity checks as NXP's distro does.
SKIP_META_VIRT_SANITY_CHECK = "1"
# MISSING: no survey covers it; as above, for meta-security.
SKIP_META_SECURITY_SANITY_CHECK = "1"
# MISSING: no survey covers it; as above, for meta-tpm.
SKIP_META_TPM_SANITY_CHECK = "1"
# MISSING: no survey covers it; carried over from NXP's fsl-imx-base.inc: PAM for login and systemd.
DISTRO_FEATURES:append = " pam"

# MISSING: no survey names the distro identity; a naming choice of this layer.
DISTRO = "trusted-imx95"
# MISSING: no survey names the distro identity; a naming choice of this layer.
DISTRO_NAME = "trusted-imx95 headless image"
# MISSING: no survey names a version scheme; provisional until the owner decides.
DISTRO_VERSION = "0.0.0-provisional"

# hardening-survey section 7: the init manager is systemd (OE-core wrynose
# ships 259.5, the version section 8 is written against).
INIT_MANAGER = "systemd"

# hardening-survey section 7: the board runs xkmsd, not a display stack, so no
# x11, wayland, graphics or audio. MISSING: the survey does not cover the
# wireless features (bluetooth wifi nfc 3g); they are removed as headless
# defaults of this layer.
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan alsa pulseaudio bluetooth wifi nfc 3g"
# hardening-survey section 7: no audio, so pulseaudio is not backfilled.
DISTRO_FEATURES_OPTED_OUT:append = " pulseaudio"
# hardening-survey section 7: no display stack, so no X11, weston or splash.
IMAGE_FEATURES:remove = "x11-base x11 weston splash"
