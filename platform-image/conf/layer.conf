# The platform-image directory as a Yocto layer: it carries the distro
# configuration conf/distro/trusted-imx95.conf. Provisional default, pending
# the owner's answer on #14. Not parsed by bitbake yet.
BBPATH .= ":${LAYERDIR}"

# MISSING: no survey covers the recipe search path; the image recipes live in
# recipes-core/images.
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"

# MISSING: no survey covers it; the kernel append (recipes-kernel/linux) is a
# bbappend, which the line above does not match.
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "trusted-imx95"
BBFILE_PATTERN_trusted-imx95 = "^${LAYERDIR}/"
BBFILE_PRIORITY_trusted-imx95 = "9"
LAYERSERIES_COMPAT_trusted-imx95 = "wrynose"
