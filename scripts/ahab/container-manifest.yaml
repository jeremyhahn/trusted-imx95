# Container manifest for scripts/ahab/policy-check.sh: the image's containers in order; any difference fails.
# role nxp: sha256 of the merged NXP container (64 hex, or "policy" for NXP_CONTAINER_SHA256). role oem: checked against the OEM policy values.
# images: core_id, image_type, sha256, load_address and optional entry_point, each a literal or policy:<KEY> from the release policy file or environment.
# The OEM boot container carries the Cortex-M7 image; the A55 container carries the cortex-a55 data image.
containers:
  - role: nxp
    sha256: policy
  - role: oem
    images:
      - core_id: cortex-m7-1
        image_type: executable
        sha256: policy:M7_IMAGE_SHA256
        load_address: policy:M7_LOAD_ADDRESS
        entry_point: policy:M7_ENTRY_POINT
  - role: oem
    images:
      - core_id: cortex-a55
        image_type: data
        sha256: policy:A55_IMAGE_SHA256
        load_address: policy:A55_LOAD_ADDRESS