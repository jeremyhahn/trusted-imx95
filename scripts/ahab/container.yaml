# nxpimage ahab export config for make ahab-sign-test: one OEM container for the i.MX 95 B0 around a random payload, signed with a throwaway P-384 test SRK.
# fuse_version is 0 for this test container only; real-device values come from IMX95RM and the Security Reference Manual.
family: mimx9596
revision: b0
target_memory: standard
output: container.bin
containers:
  - container:
      srk_set: oem
      used_srk_id: 0
      srk_revoke_mask: '0x00'
      fuse_version: 0
      sw_version: 0
      signer: type=file;file_path=srk0.pem
      images:
        - image_path: payload.bin
          load_address: '0x90000000'
          entry_point: '0x90000000'
          image_type: data
          core_id: cortex-a55
          hash_type: sha384
      srk_table:
        srk_array:
          - srk0.pub
          - srk1.pub
          - srk2.pub
          - srk3.pub
