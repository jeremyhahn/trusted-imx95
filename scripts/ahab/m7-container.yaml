# nxpimage ahab export config for make ahab-m7-test: one OEM container whose single image is laid out for the Cortex-M7 (core cortex-m7-1, TCM load 0x0, entry 0x303C0000), signed with a throwaway P-384 test SRK.
# sw_version and fuse_version are 0 for this test container only; real-device values come from IMX95RM.
family: mimx9596
revision: b0
target_memory: standard
output: m7-container.bin
containers:
  - container:
      srk_set: oem
      used_srk_id: 0
      srk_revoke_mask: '0x00'
      fuse_version: 0
      sw_version: 0
      signer: type=file;file_path=srk0.pem
      images:
        - image_path: payload.bin
          load_address: '0x00000000'
          entry_point: '0x303C0000'
          image_type: executable
          core_id: cortex-m7-1
          hash_type: sha384
      srk_table:
        srk_array:
          - srk0.pub
          - srk1.pub
          - srk2.pub
          - srk3.pub
