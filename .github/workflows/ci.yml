# ci-template: v1.35.2 — canonical CI for all first-party Go repos.
# v1.35.2 (2026-11-11, Company Agent m2577, Codex finding on xkey-android
# #129): the `Signatures` job leaves this workflow. It ran in the pull
# request's own workflow, so the pull request's tree held the verifier that
# judged it. It is now signatures.yml (signatures-template v1), on
# pull_request_target: GitHub reads it from the base branch, it checks out
# the base only and reads the pull request's commits as objects, and it no
# longer reads the registry from the head. CI Gate drops `signatures` from
# its needs; the ruleset requires `Signatures / Signatures` beside it. A
# repository adopts v1.35.2 in one CI-file PR: ci.yml, signatures.yml and
# .github/allowed_signers. Every other job, gate and tier is v1.35.1's.
# v1.35.1 (2026-11-11, CA m2557, Codex findings on go-luks2 #444 and
# xkey-android #129): the Signatures job fetches a named base that is not in
# the clone and fails closed when it still cannot be read (it no longer falls
# back to the head's registry and the head commit alone), and its
# signature-presence check reads the whole commit object, so a long signed
# message cannot fail under pipefail with SIGPIPE.
# v1.35 (2026-11-11, Company Agent m2557, owner ruling on commit signing): a
# `Signatures` job verifies every commit in the range against the
# repository's .github/allowed_signers registry, read from the base commit,
# and accepts a GitHub-made commit only when the API reports it verified as
# web-flow; it fails closed and is in CI Gate's needs as a `pr` job. A
# repository adopts v1.35 in one CI-file PR with its .github/allowed_signers
# (handbook software/templates/signing/<repo>.allowed_signers); every other
# job, gate and tier is v1.34.1's.
# v1.34.1 (2026-11-08, Company Agent m2226 item 2, ruling 377): one change.
# GO_BUILD_PROXY is <DEVCACHE_GOPROXY>|https://proxy.golang.org, with no
# trailing `direct`: the handbook allows no direct fetch anywhere
# (dependency-resolution.md, "No direct fetch, anywhere"). A private module
# is unaffected, because GOPRIVATE/GONOPROXY paths never use GOPROXY. Every
# job, gate and tier is v1.34's, and in-toolchain-image.sh is v5. A
# repository adopts v1.34.1 in its v1.34 adoption PR, or in one CI-file PR
# if v1.34 is already merged.
# v1.34 (2026-11-08, Company Agent m2211 item 2(b)): fewer jobs per run. The
# `changes`, `schedule-guard` and `arch-gates` jobs are one `preflight` job,
# in that order of concern but with the guard first and nothing checked out
# before it. The template's job count goes from 10 to 8, and a PR run starts
# two fewer hosted runners. Their outputs are needs.preflight.outputs.*, and
# CI Gate checks `preflight` in their place. The unit and race shards are
# the repositories' own CUSTOMIZE jobs: each merges its shards into one job
# in its v1.34 adoption PR. A repository adopts v1.34 in one CI-file PR.
# v1.33.2 (2026-11-08, Company Agent m2113 item 3, with InfoSec): the
# releasability step takes an InfoSec waiver. A matched line that carries
# `lab-string-ok: <reason>` on the same line, the colon and a reason
# required, is not a failure; a bare marker is. The step prints the path and
# line of each waived line as a notice and its count, never the value
# (go-trusted-platform #1348's mechanism, ported).
# v1.33.1 (2026-11-08, Company Agent m2107 item 4): comments only; the
# pattern file's source is named as dept-infosec
# security/internal-names.patterns, not platform-configs.
# v1.33 (2026-11-08, Company Agent m2104 item 2): the releasability step
# knows the five classes of the regenerated pattern file: coord-host,
# internal-email, lab-address, lab-host and owner-path (optional `/i`).
# With the v1.32 set of three, every gate run on the new secret failed on
# an unknown class. The image namespace comes from the repository variable
# CI_IMAGE_NAMESPACE (Company Agent m2101 item 2).
# v1.32 (2026-11-08, Company Agent m2098 item 2, InfoSec finding): the
# releasability step reads the private pattern file as it is written. Each
# line is `class<TAB>regex` (blank and `#` lines skipped); v1.31 grepped the
# whole line as one fixed string (-F), so no line could match and the gate
# was green for a false reason. The step now checks the class (lab-address,
# lab-host or owner-path, optional `/i`), checks each regex with grep -E,
# fails on a malformed line printing its number only, and runs
# `git grep -i -E` over the regex fields, printing path and line only.
# v1.31 (Company Agent m2069 item 3, owner rule 2026-11-07): the internal-name
# gate reads its patterns from the private side. A public repository never
# lists the company's names, hosts or addresses, not even as patterns to
# refuse. The lint job's `Releasability (private patterns)` step (now
# releasability.yml) takes the pattern file from a private Actions secret (v1.32:
# class<TAB>regex lines; the source file is dept-infosec
# security/internal-names.patterns) and fails on
# any match in the tracked tree, printing path and line only, never the
# value. RELEASABILITY_TEST keeps the repository's own test, which checks
# generic shapes only (public-hygiene.md "Internal values stay private").
# v1.30 (Company Agent m1804, 2026-10-31): the five fixes of the 72-hour CI
# evaluation (ci-standard.md §12). go-qrdb #1328, three comment lines, cost
# about 1100 runner-minutes over three runs, and every push to main reran the
# full tier on a tree a run had already proved.
#   1. The toolchain image is built once per content hash (Dockerfile, pin
#      file, go.mod and go.sum, ci-standard.md §9) by the new publish-images
#      job on the release runner, and pulled from the registry cache by every
#      other job (scripts/ci-image-cache.sh v1, ships beside this file). The
#      lint-class stages leave the image job for the new `lint` job, which
#      needs the toolchain image alone (`make docker-build-toolchain`), so
#      they run beside build and make coverage. lint-gates builds the
#      toolchain image alone as well.
#   2. A push to main whose tree already has a green full-tier run (a run of
#      this workflow whose Integration job succeeded) gets the schedule
#      guard's `proven` verdict: its bigdisk jobs skip, the guard records the
#      proving run id, and CI Gate reads the skips as passed. The history
#      secret scan (history-scan) is the exception: it runs on every push
#      and pull request, proven or not, and the gate never accepts it
#      skipped (trusted-imx95). No hourly or
#      lane ci:full reruns; lint-sweeps run in nightly.yml only.
#   3. lint-gates is path-scoped on a pull request (LINT_GATES_PATTERN, the
#      changes job's `lint_gates` output). A pull request from a checkpoint
#      branch (lane-ckpt/*) is refused. cancel-in-progress stays true
#      (v1.26.2). A PR stays draft until lane-verify passes (ci-standard.md
#      §10 (f)).
#   4. Every job carries timeout-minutes; a CUSTOMIZE value is ceil(1.5 x the
#      job's 72-hour p95), with a root-cause row in ci-standard.md §12 for any
#      job at its cap. block_on_outdated_branch is off on the P1 repositories
#      (an Infrastructure setting, setup-pr-sdlc.sh; no workflow change).
#   5. gosec runs in the PR tier (`make gosec`, the lint job; make security
#      keeps it on the full tier), and a workflow_dispatch off main is
#      refused: no full tier on a PR branch, ever. CI_FULL_TIER no longer
#      selects one.
# New CUSTOMIZE values: LINT_GATES_PATTERN, the timeouts, CI_IMAGE_NAMESPACE.
# New Makefile targets: `make gosec` (devops.md §4) and
# `make docker-build-toolchain` (devcontainer.md §6). A repository adopts
# v1.30 in one CI-file PR, bottom-up in stack order.
# v1.29.5 (Company Agent ruling 262(a), 2026-10-30): one change, the
# GO_BUILD_PROXY separator. Each `make docker-build` passes
# GO_BUILD_PROXY=<DEVCACHE_GOPROXY>|https://proxy.golang.org|direct, with
# `|` as everywhere else (devops.md §2a): Go falls through a `,` only on a
# 404 or 410, and through a `|` on any error, so a cache that answers the
# probe and then fails a fetch no longer fails the build. "$bp" stays one
# quoted make argument; the repository's Makefile quotes the value on its
# docker build line (`--build-arg "GO_BUILD_PROXY=$(GO_BUILD_PROXY)"`), where
# an unquoted `|` is a shell pipe. v1.29.4's `,` and its Makefile exception
# go. Every job, gate, tier and in-toolchain-image.sh v4 is v1.29.4's. A
# repository adopts v1.29.5 in the one CI-file PR that adopts v1.29.4, with
# its Makefile's quoting line.
# v1.29.4 (Company Agent ruling 261(c), 2026-10-30; claude-agents #379
# comment 157032): three changes, and no job, gate or tier change.
#   - the module fetches of the image build go through Athens first, with the
#     proxy.golang.org fallback. The toolchain image build and the Lint Gates
#     build fetched from proxy.golang.org alone and failed on its HTTP/2
#     stream errors (#379 comment 169857). Each `make docker-build` passes
#     GO_BUILD_PROXY=<DEVCACHE_GOPROXY>,https://proxy.golang.org,direct when
#     the runner sets DEVCACHE_GOPROXY (devops.md §2a) and the cache answers a
#     5-second probe; otherwise it passes none, as before, so the github.com
#     mirror is unchanged (v1.29.5 makes the separator `|`). A bridge stage
#     (scripts/in-toolchain-image.sh v4) sets GOPROXY with `|`, Athens first;
#     GOPRIVATE travels with both, so a private path never reaches a proxy;
#   - the schedule guard reads `waiting` before `in_progress`. A run moves
#     only waiting, then in_progress, then done, so the other order let a run
#     start between the two queries and be counted by neither, and a nightly
#     start beside it (trusted-firmware's fix, from its v1.29.3 adoption);
#   - scripts/in-toolchain-image.sh v4: the stage's sibling container takes
#     the job slot's memory bound (--memory from the job container's cgroup
#     memory.max, 8g with no limit, IN_IMAGE_MEMORY overrides; --memory-swap
#     the same, so no swap), and Go's build and link scratch (TMPDIR,
#     GOTMPDIR) is an anonymous volume on /var/tmp on the daemon's data disk,
#     not the 3 GB /tmp tmpfs (go-xkms #1733, from the 2026-10-26 ENOSPC).
# A repository adopts v1.29.4 in one CI-file PR that takes ci.yml and
# scripts/in-toolchain-image.sh together, keeping its CUSTOMIZE blocks; a
# repository whose copy already holds a change (go-qrdb and
# go-trusted-platform the memory bound, go-xkms the scratch volume,
# trusted-firmware the guard order) keeps it and takes the rest.
# v1.29.3 (Company Agent ruling 255(10)/(11)(c), 2026-10-29): one schedule
# run per repository, skipped when a main run is in flight. The 04:00Z
# nightly cron on every repository started six main runs over the throttle
# and drove ci-node-2 /mnt/disk1 to 93 %. Two changes:
#   - a schedule run's concurrency group is `schedule-{repository}`, with no
#     sha, so a repository has one schedule run at a time. cancel-in-progress
#     stays a literal `true`, so a newer schedule run cancels an older one
#     still in flight. The push, pull_request and workflow_dispatch groups do
#     not change;
#   - a new `schedule-guard` job on ubuntu-latest, beside `changes`, asks the
#     Gitea API on a schedule run only whether this workflow has a push run on
#     main in progress or waiting, and sets `verdict`: `run`, `busy` or
#     `unreadable`. On any other event, and on the github.com mirror, it sets
#     `run` without a call. On a schedule run every bigdisk job (image,
#     lint-gates, integration, soak, and any CUSTOMIZE job on bigdisk) runs
#     only on `run`. On `busy` CI Gate skips as well, so `CI / CI Gate
#     (schedule)` posts `skipped`, never a green nightly. On `unreadable` the
#     bigdisk jobs skip and CI Gate fails, naming the guard: the guard fails
#     closed and never passes silently.
# Gitea 1.27.1, read 2026-10-29: the guard calls
# GET /repos/{owner}/{repo}/actions/workflows/ci.yml/runs?event=push&branch=main&status=<s>
# once with waiting and then once with in_progress (v1.29.4) (`pending` and `requested`
# read as waiting; `running` is refused as an invalid status). The route
# counts this workflow only: on the repository-wide route, go-qrdb's stuck
# release-lockstep run 70835 reads in_progress and would hold every nightly
# off. The guard trusts the server's status filter, never a listed run's
# `status`: go-qrdb run 65111 lists as in_progress with every job completed,
# and no status filter returns it. It reads with the job token first, under
# `actions: read`. No workflow had read the Actions API with the job token,
# so a non-200 answer falls back to AGENT_TOKEN, which revert-red-main.yml
# already reads runs with. The guard checks nothing out, and it receives
# AGENT_TOKEN only on a schedule run. A repository adopts v1.29.3 in one
# CI-file PR, which can ride its v1.29.2 adoption bump PR while that is open.
# v1.29.2 (Company Agent ruling 239(8), 2026-10-28): comments only; no job,
# gate or tier changes. A CUSTOMIZE job gated on a changes output (a path-gated
# suite) needs the image job too and tests an output of the image job in its
# `if:`. On a pull_request, an `if:` that reads only `needs.changes.result` or
# only `needs.changes.outputs.*` left such a job skipped unstarted (two runs
# in a row); one that also tests the image job's output started it. A
# repository needs no adoption PR.
# v1.29.1 (Company Agent ruling 226(15), 108 repair, 2026-10-27): lint fails
# fast. The lint-gates job runs `make lint-gates` without `-k`, so the first
# failing gate ends the step. Under `-k` make went on running the other gates
# after one had failed: in go-quicbaas run 68949 Lint took 51.5 min, 37 of
# them after the `go vet` failure. A red gate now reports as soon as it fails,
# and the gates after it run on the next push. No other job, gate or tier
# changes. A repository adopts v1.29.1 as a CI-file PR.
# v1.29.0 (Company Agent ruling 220(5) and 221(4), 2026-10-27; handbook #474):
# the Alpine package index checksum joins the integration image's tag hash.
# Before v1.29 the tag hashed only the tree, so a tree whose files had not
# changed kept its cached image after Alpine shipped a fix, and `trivy image`
# stayed red on a fixed CVE until an unrelated file moved (go-enclave main
# fd83b79ce, CVE-2026-92392, libcurl 8.23.0-r0). A new step, "Read the Alpine
# package index", runs scripts/apk-index-sum.sh (v1, ships beside this file)
# and puts its value in APK_INDEX_SUM. Every job that names the integration
# image (image, lint-gates, integration, soak) runs it before "Name the
# integration image", so none waits for the image job's serial stages. The
# repository's `make -s it-image` hashes APK_INDEX_SUM, and `make
# docker-build` passes it to the integration image's build as `--build-arg
# APK_INDEX_SUM`. The Dockerfile's `integration` stage declares the ARG and
# then, as root, runs `apk upgrade --no-cache`, so a new sum misses the cache
# from that step on (ci-standard.md §9, devcontainer.md §6); `base` and
# `toolchain` do not declare it. So a new Alpine package release changes the
# tag and forces a rebuild, with the fixed package. A base image the script
# cannot read fails the job: a missing index is never a pass. A repository
# adopts v1.29 as one PR: this file, scripts/apk-index-sum.sh (in its
# shellcheck list), the Makefile's APK_INDEX_SUM in it-image and docker-build,
# and the Dockerfile's ARG and apk upgrade. A repository whose integration
# image has no apk base gets `none`, a constant, so its tag changes only with
# its tree. The parallel stage jobs move to v1.30: `runs-on` cannot take a
# needs output on Gitea 1.27.1 (run 68501), and the registry-push question is
# with the owner (169).
# v1.28.0 (Company Agent ruling 219(3), 2026-10-26): `make deps-check` joins
# the PR tier as a lint-class gate. Its step in the image job drops the
# CI_FULL_TIER condition and runs on every event, as `make lint` does, so a
# module behind its dependency floor fails the PR, not main after the merge
# (go-objstore main 8946d5f53 went red on its push run for exactly this; fixed
# by go-objstore #127). The step keeps IN_IMAGE_NETWORK=bridge for the module
# proxy and runs in seconds; it stays on the full tier too. The image job is
# already `pr` in CI Gate, so no needs or results line changes. A repository
# adopts v1.28 as a CI-file PR; none hand-patches its ci.yml ahead of it.
# v1.27.0 (Company Agent m1192 (6), item 27, 2026-10-25): a new `lint-gates`
# job runs a repository's `make -k lint-gates` in the toolchain image in
# parallel with the image job's `make lint`, not in series after it, so Lint's
# wall time is the longer of the two, not their sum. The job runs the target
# only when the Makefile or a tracked *.mk defines it; without one it prints
# OK, builds no image and passes. It gets the toolchain image as the image job
# does (`make docker-build`, then `make -s toolchain-image`) with the same
# cache classes, skips on a draft, is on the PR tier (a docs-only PR runs it)
# and is in CI Gate's needs and results check as `pr`. `make lint` and
# `go vet` do not change. Adopting v1.27 in a repository whose `make lint`
# lists lint-gates (or runs it from its recipe) removes lint-gates from the
# lint target in the same PR, and a repository that ran `make lint-gates` as
# a step of its lint or image job drops that step, or the gates run twice.
# A gate that needs a network sets the job's IN_IMAGE_NETWORK (CUSTOMIZE).
# v1.26.2 (Company Agent m1167 (5), ruling 145, 2026-10-24): main CI runs are
# keyed per sha, so a merge never cancels the main run in progress. The main
# group is `main-{event}-{sha}`: each commit's run on main is its own group
# and runs to the end, and a schedule or workflow_dispatch run still never
# shares a group with a push run. This supersedes v1.25's `main-{event}`
# group (m857, m774 option (i)). cancel-in-progress stays a literal `true`, so
# a PR's newer push still cancels its older run. Only the group changes.
# v1.26.1 (Company Agent m1128 (9), 2026-10-24): a docs-only PR runs the repository's
# releasability test (RELEASABILITY_TEST, CUSTOMIZE), which make coverage
# runs on every other PR, so a private value in README.md or docs/ fails the
# PR rather than the main push after it merges.
# v1.26 (Company Agent m804 item 3, m809 item 3; ruling 137, 2026-10-24): a
# draft pull request runs no CI. Every job but CI Gate skips when
# github.event.pull_request.draft is true (Gitea sets it on a WIP: title),
# and CI Gate fails on a draft without running anything, so no draft head
# carries a green or skipped gate into its merge. Marking the PR ready
# starts no run, and there is no edited or ready_for_review trigger (an
# edited run would join the PR's group and cancel a run in flight): the
# PR's own lane pushes an empty commit when the PR leaves draft. (Handbook
# v1.35.3, Software DS-8551, adds `ready_for_review` to the types; see
# `on.pull_request` below.)
# v1.25.4 (2026-10-21, from a Codex review): `pull_request` lists its types,
# [opened, synchronize, reopened], with no `labeled`, as several repositories'
# CUSTOMIZE copies already did. A `ci:full` label takes effect on the PR's
# next push or update-branch, or through workflow_dispatch; the label alone
# starts no run.
# v1.25.3 (2026-10-21, from a Codex review): the reaper's in-use check and its
# `docker image rm` were two calls, so a job could take its lease and re-tag
# between them and still lose the tag. They now share a lock with the lease
# step and every re-tag: a created, never-started container named
# <prefix>image-lock, from an empty image <prefix>image-lock:base that the
# step or the reaper imports when it is missing. The daemon allows one container of that
# name. The lease step takes the lock around the inspect, lease and second
# inspect (not around the rebuild), and writes the lock functions to
# $RUNNER_TEMP/image-lock.sh for the re-tags; a lock created more than 600 s
# ago is a dead holder's and is removed by its id. A step that cannot take
# the lock in 660 s fails. Ships reap-stale-ci-stacks.sh v5.
# v1.25.2 (2026-10-21, from a Codex review): a job keeps the integration
# image's tag while it holds the lease. Two trees that differ only in a file
# the build ignores share one image id under two tags, and the reaper's
# `docker image rm <tag>` untagged that id even while a lease held it, so a
# later `docker save` or integration run on the tag failed. The lease step
# exports the leased id as IT_LEASE_ID, and docker save, make
# integration-test and each soak iteration first run `docker tag
# "$IT_LEASE_ID" "$IT_IMAGE"`. Ships reap-stale-ci-stacks.sh v4, which keeps
# every tag of an image id a container uses.
# v1.25.1 (2026-10-20, from a Codex review): the "Lease the integration
# image" step in the image, integration and soak jobs is bounded and never
# skipped. v1.23 leased only an image it found, and a failed `docker create`
# did not fail the step, so an image reaped before its lease left the job
# unleased and green. The step now inspects the image, leases it by id with
# --pull never and inspects the tag again for the same id; if the image is
# gone it runs `make docker-build` once, leases and inspects again, and fails
# with an error if the image is still missing. Only that step changes.
# v1.25 (Company Agent m857, 2026-10-20; superseded by v1.26.2, ruling 145):
# main has one concurrency group per event, so a newer push to main cancels
# the older in-progress main push run.
# At 20:00Z go-qrdb had three main-push runs in progress on three commits and
# 148 jobs waited fleet-wide. The main group is `main-{event}` (m774 option
# (i), on go-qrdb main since m772), not the ref alone, so a workflow_dispatch
# or schedule run on main never cancels a push run. This reverses v1.22.1 and
# v1.23 (m636, m695): an older main commit no longer keeps its own run, and
# the newest run validates every merge under it. cancel-in-progress stays a
# literal `true`. A PR ref is one group, as before. Only the group changes.
# v1.24.1 (2026-10-20): the changelog and comments cite no internal
# repository and no internal issue number, so a repository that publishes its
# workflows passes its releasability scan. One job change: the `changes`
# job's diff takes --no-renames, so a file moved from code into docs/ lists
# its old path too and the PR is not docs-only.
# v1.24 (owner ruling 2026-10-19, Company Agent m749 and m751 (a), (e)):
# a PR whose every changed file is markdown or under docs/ (DOCS_ONLY_PATTERN,
# the new `changes` job) runs lint alone: build, the build-tag assertion and
# make coverage skip. Soak moves off main pushes and ci:full to the nightly
# schedule and workflow_dispatch, a `nightly` job in the Gate (ci-standard.md
# §8, §10).
# v1.23.1 (2026-10-19): ships reap-stale-ci-stacks.sh v3, which
# ages an integration image from the later of its creation and its last tag,
# so a parallel job's reaper no longer removes an image just rebuilt from
# cache (go-quicraft main runs 57389 and 57484). No job changes.
# v1.23 (owner item 101 as approved, Company Agent m650 item 3, 2026-10-18):
# two tiers. A pull request runs the PR tier only: lint (with
# assert-build-tags and arch-gates), build, and the unit suite under -race
# (`make coverage`, so unit test and race are one step). Integration, Soak,
# security, deps-check and trivy image do not run on a PR (v1.28 puts
# deps-check on the PR tier). The full tier runs
# on main after every merge (push), nightly (a new `schedule:` trigger), on
# workflow_dispatch, and on a PR labelled ci:full (kept as the opt-in). A new
# `soak` job loops the integration suite in the integration image for
# SOAK_MINUTES. CI Gate stays the one required check; integration and soak are
# `full` in it. A red full tier on main is reverted through a PR by the new
# revert-red-main.yml (ships beside this file; ci-standard.md §8). A repo's
# CUSTOMIZE race job joins the PR tier (`pr` in CI Gate, no tier `if:`); its
# other CUSTOMIZE suites take CI_FULL_TIER's expression and are `full`.
# v1.23 also (Company Agent m674 item 3, 2026-10-18: per-run image tags filled
# ci-node-1 at 100G per 17 minutes): one image tag per family, keyed by
# content. The integration image is <repo>-ci-it:<hash> (`make -s it-image`,
# the go-qrdb #814 pattern), built once per runner and reused by every job and
# run with that tree; no job removes it, and reap-stale-ci-stacks.sh v2
# removes one older than REAP_IMAGE_MIN_AGE that no container uses
# (ci-standard.md §9).
# v1.23 also (Company Agent m695, 2026-10-18): the concurrency block keeps
# cancel-in-progress a literal `true` and gives main one group per event and
# commit, so main runs never cancel or queue behind each other; v1.22.1's
# expression left go-qrdb main run 57063 waiting with no task. (v1.25 replaced
# this group with `main-{event}`; v1.26.2, ruling 145, keys main per sha again.)
# v1.22.2 (Company Agent m641 item 2 and m646 item 3, 2026-10-18): each stage
# runs at the job slot's CPU bound. in-toolchain-image.sh v3 reads the job
# container's cgroup cpu.max and gives the stage container that --cpus, with
# GOMAXPROCS and GOFLAGS=-p from it; golangci-lint follows the quota. No
# number is hardcoded: a 4-CPU Dell slot gives 4. No job changes.
# v1.22.1 (Company Agent m636 item 2, 2026-10-18, after go-quicbaas main
# fe167500f was left with no completed run): the concurrency block is
# canonical. A newer push to a PR ref still cancels that ref's older run, but
# a push to main never cancels an in-flight main run: each main commit keeps
# its run, so every merge is validated. Every repository carried the block as
# a CUSTOMIZE copy with `cancel-in-progress: true` on every ref, main included
# (devops.md §9); the copy goes and the canonical block replaces it. Adopted
# with the v1.22 rollout.
# v1.22 (Company Agent m616 item 2, 2026-10-18, after CI job layers filled the
# runner disks): the image job's stages keep the Go build, golangci-lint and
# module caches in named volumes on the runner's Docker host, kept across jobs
# and split by trust class (CI_CACHE_CLASS: `main` for a push to main, `pr`
# otherwise), never in a job container's writable layer or its /tmp
# (ci-standard.md §6; in-toolchain-image.sh v2). A new step,
# trim-ci-caches.sh, bounds the repo's cache volumes on the host
# (CI_CACHE_MAX_GIB, default 32).
# v1.21.1 (Company Agent m605 item 8, 2026-10-18, after a forge token printed
# in a go-xkms run): the image and integration jobs mask the forge
# credentials first, and no step or make target prints an env file, the job
# environment or a matched line; lint steps and `make check-public-literals`
# report path and line only, and `make stage-gomodauth` runs silent
# (ci-standard.md §5). Every v1.21 rollout PR adopts v1.21.1 before it merges.
# v1.21 (Company Agent m598 items 1 and 2, 2026-10-18): every stage runs in
# the project's own devcontainer image (ci-standard.md §2, devcontainer.md §7).
# Through v1.20 lint, security, build and test installed Go with setup-go on
# the runner and ran their own flag sets, which §2 ("not the runner image, ...
# not a tool installed on the runner") and devops.md §4 and §8 rule out; a repo
# that also ran the stages in its image (go-quicraft a141c3c) ran each twice.
# Now one image job (m601 (a), go-quicraft's shape) builds the images once
# (`make docker-build`) and runs each stage's make target in the toolchain
# image as a step, through scripts/in-toolchain-image.sh (from go-quicraft,
# ships beside this file): lint, build, test (`make coverage` with
# COVERAGE_THRESHOLD, m601 (c)), security, deps-check (new, ci-standard.md
# §1) and trivy image on the integration image (it leaves the CUSTOMIZE note).
# The integration stage stays its own job, `make integration-test` in the
# integration image. Both run on bigdisk (ubuntu-latest on github.com).
# setup-go, the runner tool installs and the SARIF upload (m601 (d): CI runs
# on Gitea) are gone, and with them GO_VERSION: the image pins Go. The tag
# assertion moves to scripts/assert-build-tags.sh (ships beside this file).
# CI Gate runs on ci-gate (m386) with go-quicraft's pr/full tier, and its
# needs list and check lines are a CUSTOMIZE block (m598 item 2). The make
# variables the jobs pass are in devcontainer.md §6 (m601 (b)).
#
# v1.20 (Company Agent m270 items 1 and 9, 2026-10-16): the CUSTOMIZE image
# job's `trivy image` also takes `--skip-dirs /opt/go/mod`, so a secret match
# in a third-party module's source inside the image's Go module cache no
# longer fails the scan; a secret in the repo's own layers still does, and no
# repo carries its own trivy secret config. A new `arch-gates` job (from
# go-xkms) fails a direct go-objstore import outside the repo's storage seam,
# and CI Gate needs it.
# v1.19 (Company Agent m262 items 3 and 4, 2026-10-16): the CUSTOMIZE image
# job takes `trivy image --ignore-unfixed` (devops.md §8): a fixed CVE still
# blocks, an advisory with no fixed package does not, and no repo adds a
# .trivyignore for it. The github.com gosec install builds the latest gosec
# tag against the latest x/tools in the one form of devcontainer.md §2.
#
# v1.18 (2026-10-12): a CUSTOMIZE integration job that starts
# containers on the runner host runs scripts/reap-stale-ci-stacks.sh first
# (ships beside this file). Its `if: always()` teardown dies with the job when
# the host or the Docker daemon goes down, and nothing removed the stack after:
# 11 exited stacks, with their networks and volumes, stayed on ci-node-1 and
# ci-node-2 after the 2026-10-11/12 restarts. See the CUSTOMIZE note above
# ci-gate.
#
# v1.17: third-party actions pinned by commit, the tag in a
# trailing comment (devops.md §9 "Actions are pinned by commit").
#
# v1.16: gosec, govulncheck and actionlint
# install only on github.com; Gitea jobs use the runner image's baked, pinned
# tools.
#
# v1.15 (2026-10-05): push runs on main
# only again. automerge.yml v7 opens each merge train as a PR from
# merge-train/* into main, so the train gets its CI from the pull_request
# trigger like any PR, and block_on_outdated_branch stays on (owner,
# 2026-10-04: "leave the block_on_outdated_branch turned on, we want to make
# sure we are requiring the latest from main in all branches before they get
# merged in"). The parallel stages of v1.14 stay.
#
# v1.14 (2026-10-04): every job starts
# at once, so a run takes as long as its slowest job. security, test and any
# CUSTOMIZE integration job no longer wait on lint + build; CI Gate, the one
# required check, still needs every job and fails closed on any result but
# success. (v1.14 also ran push on 'merge-train/**' for automerge.yml v6's
# trains; v1.15 drops that.) Owner, 2026-10-04: "yes
# lets batch the merges. make sure we are doing things efficiently!" and "use
# merge trains where possible if that helps!". Supersedes v1.9's staged
# ordering: a broken push now spends the heavy tier too, in exchange for the
# shortest wall-clock to a green gate, which is what a train waits on.
#
# v1.13 (2026-09-27): GO_VERSION 1.26.7 -> 1.27.1, in
# lockstep with nightly-template v1.6.
#
# v1.12 (2026-08-28, go-blockstore #22 round 2): refresh install-shellcheck.sh to
# the hardened version — the idempotency fast path that trusted an existing
# binary on its `--version` string alone is removed, so the extracted binary's
# SHA-256 is verified every run (an attacker who pre-seeds a matching --version
# no longer bypasses the checksum). The v1.11 copy shipped the pre-round-2
# script carrying that hole; this replaces it byte-for-byte with merged main.
#
# v1.11 (2026-08-28, go-blockstore #22): the lint job installs a PINNED,
# checksum-verified shellcheck (install-shellcheck.sh, ships beside this file)
# so actionlint's SC* rules actually run — without shellcheck on PATH actionlint
# silently disables them and exits 0, and a real SC2046 reached main that way.
# SHIPS-WITH gains install-shellcheck.sh (chmod +x, copy to scripts/).
#
# v1.10 (2026-08-27, go-blockstore #7 Codex review):
#   - actionlint runs in the lint job. devops.md §4 lists actionlint in
#     `make lint`, but through v1.9 the canonical CI never ran it — so the
#     workflow files were the one thing in every repo no CI check read, and a
#     misspelled runner label or invalid Actions YAML reached main having
#     passed a green required gate. Ships with .github/actionlint.yaml (same
#     template directory), which is what keeps self-hosted labels from
#     reading as unknown runners.
#   - the gosec SARIF upload is guarded on the PR head not being a fork.
#     GitHub downgrades the token to read-only for a pull_request from a fork
#     REGARDLESS of the `permissions:` block below, so the step failed the PR
#     for something an external contributor could not fix.
#
# v1.9 (2026-08-20, owner ruling — FAIL-FAST STAGED PIPELINE): iterate fast.
# Gitea cannot cancel in-flight jobs (no cancel route — task #90), so
# fail-fast comes from ORDERING: a fast tier (lint + build, ~minutes) gates
# the expensive tier (security, test, integration where present). A broken
# push reports in minutes and burns nothing downstream; a green push pays
# one fast-tier of extra latency. trivy and fips move to nightly.yml
# (schedule + workflow_dispatch): both were known-red on every push (fips:
# tracked per-repo fips140=only issues; trivy: undiagnosed install failure),
# and a known-red job burning 60-90 runner-minutes per push verifies
# nothing. The gate now distinguishes SKIP (upstream stage failed) from
# FAIL, both failing closed — this supersedes v1.8.1's lint-decoupling,
# whose silent-skip hazard is closed at the source (pinned linter) and in
# the gate (named skips).
#
# v1.9.1 (2026-09-01, owner ruling — devops.md 8a): the trivy move above is
# ALPHA-ONLY, and the note that it "gates nothing" is a phase, not a property.
# Every repo here is private and unreleased; from the first release published to
# the github.com mirror, that repo moves `trivy fs` BACK into ci.yml and into
# the ci-gate `needs`, blocking on CRITICAL/HIGH. Two consequences for adopters:
#   - the exposure window is real and accepted: in alpha a dependency CVE
#     surfaces at the next nightly, not at the push that introduces it;
#   - a repo where trivy is GREEN may keep it in ci.yml today and that is NOT a
#     deviation. The "undiagnosed install failure" premise above is repo-
#     specific and was measurably false in go-trusted-platform, where trivy fs
#     caught two live HIGH x/mod CVEs on 2026-08-19. Nightly is the floor.
# See conventions/devops.md 8a for the trigger and the reasoning.
#
# v1.8 (2026-08-19): gosec and govulncheck triage their own exit codes. A shell
# reports a signal death as 128+N, so an OOM kill leaves 137 — indistinguishable
# from a real finding in the job summary, which is all the Gitea API exposes
# (task #97). Found on go-quicbaas: gosec reported `Issues : 0`, govulncheck was
# SIGKILLed while four sibling repos ran heavy jobs on the same host, and the
# Makefile reported it as "reachable vulnerabilities" — a phantom CVE hunt
# waiting to happen. Both steps still exit non-zero; they only say WHICH it was.
# The same conflation exists in every repo's Makefile vuln target — fix it there
# too when adopting this version.
#
# v1.7 (2026-08-18): gosec -concurrency 4. The v1.6 GOMEMLIMIT/GOMAXPROCS
# bound was PROVEN INSUFFICIENT: gosec sizes its pool from runtime.NumCPU()
# (the host's 24 cores, GOMAXPROCS notwithstanding), so live SSA for ~24
# packages exceeded the 16 GB container cap with all three observed scans
# carrying GOMEMLIMIT=10GiB while pinned at 16/16 GiB. Live heap cannot be
# GC'd away; only lower analysis concurrency shrinks it.
#
# v1.6 (2026-08-18): GOMEMLIMIT + GOMAXPROCS on the security job. The Go
# toolchain does not see cgroup limits — inside a 16 GB container it read the
# HOST's 24 cores and 94 GB, ran 24 gosec workers, and grew the heap until the
# cgroup had to swap 10.9 GB of anonymous memory. It never OOMed (swap absorbed
# it), so instead of failing it thrashed: memory PSI 98, 43% of the host's CPU
# in iowait, every other job on the box starved. Full evidence in the job's
# comment block below. This is a TUNING fix, not a capacity one: the host had
# 56 GB free throughout.
#
# v1.5 (2026-08-18): triggers narrowed to `[main]`. The template shipped
# `[master, main, develop]` with a "CUSTOMIZE" note, so 15 of 20 repos still
# name branches that DO NOT EXIST — the template contradicted the ratified
# trunk-based standard (company CLAUDE.md: "no branches, and the trunk is
# main"), and a template that disagrees with the standard loses every time it
# is copied. Inert today, because no event can fire for a branch that is
# absent; the cost is latent, not current. Recreate `develop` in any of those
# repos and its every commit runs CI twice — one push run and one
# pull_request run for the same sha — with nothing to cancel the second
# (only a ref-keyed concurrency group would cancel it: devops.md §9b).
# Do NOT re-add a branch list "for safety": a repo that needs a second trunk
# is a decision for the owner, not a default.
#
# v1.4 (2026-08-17): `fips` job added (owner mandate, security-review.md §6)
# — build + unit tests under GOFIPS140=latest with GODEBUG=fips140=only, wired
# into ci-gate. Rolls out per repo through each project agent's own issue
# (NOT a blind template sweep): FIPS mode surfaces real incompatibilities
# (non-approved primitives) that each agent must resolve or escalate as an
# owner decision before its repo adopts v1.4.
#
# v1.3 (2026-08-14): `workflow_dispatch:` trigger added, so a phantom failure
# (runner crash, host overload; see infra lessons.md) can be retried without
# pushing an empty commit.
#
#   CORRECTION (2026-08-19): this entry originally claimed "Gitea's build
#   exposes no rerun API, so without it the only way to retry a phantom
#   failure is an empty commit." That premise is FALSE and it propagated to
#   five repos. `swagger.v1.json` on 1.27.1 publishes three re-run routes:
#     /repos/{owner}/{repo}/actions/runs/{run}/rerun
#     /repos/{owner}/{repo}/actions/runs/{run}/rerun-failed-jobs
#     /repos/{owner}/{repo}/actions/runs/{run}/jobs/{job_id}/rerun
#   `rerun-failed-jobs` re-runs only a run's failed jobs. Note the job-level
#   route is NESTED under the run — the flat `jobs/{id}/rerun` shape does not
#   exist, and probing that shape is how two of us concluded the API was
#   missing. A 404 does not distinguish a missing route from a missing
#   resource; swagger is the authority.
#
#   Stated precisely, because the mistake is easy to make in reverse: these
#   routes are PUBLISHED IN THE SPEC — verified. They have NOT yet been
#   executed here, so do not upgrade this to "rerun works" until someone has
#   actually run one. What IS measured: there is no `cancel` route at any
#   path, and DELETE returns 400 "this workflow run is not done" on anything
#   unfinished, so no REST call can shed a queued run (task #90).
#
#   `workflow_dispatch` KEEPS its place regardless, on an independent
#   justification: re-run acts on an existing run, so it cannot help when a
#   run was never created — the lazy-creation case where a fresh head shows
#   no jobs for minutes. Removing the trigger because re-run exists would be
#   an overcorrection.
#
# v1.2 (2026-08-14): actions/checkout and actions/setup-go moved to @v6 —
# §9 already named checkout@v6 the standard and repos were shipping green on
# v6/v6 while this file still said v4/v5 (same defect class as promising a
# gate the template doesn't implement: the standard and the template must
# never disagree).
#
# v1.1 (2026-08-14): gosec findings now also print to the job log (the SARIF
# upload only exists on github.com, so on Gitea the findings were invisible).
# Also NEVER add `GOPROXY: direct` / `GOSUMDB: off` to a repo's env block:
# GOPRIVATE (injected by the runners, dependency-resolution.md §6) already
# exempts first-party modules from proxy and sumdb; the blanket override
# disables checksum-database verification for every third-party dependency
# and breaks the build when an upstream re-points a tag (go-tpm-tools v0.4.8,
# 2026-08-14). `ghcr.io` likewise does not exist on Gitea — use the Gitea
# registry (lessons.md).
# Source of truth: software/templates/github-actions/ci.yml in the
# handbook. Copied into each repo (never workflow_call: the
# template lives inside the security boundary and cannot be referenced from
# github.com). Blocks marked CUSTOMIZE are the only expected divergence;
# everything else drifting from the template is a defect (devops.md §8).
#
# Runs identically on Gitea Actions (dev) and GitHub Actions (public mirror);
# host-specific steps are guarded on github.server_url (devops.md §1).

name: CI

on:
  push:
    # trunk-based: main is the ONLY trunk. automerge.yml's merge trains are
    # PRs from merge-train/* and get CI from pull_request (v1.15).
    branches: [main]
  pull_request:
    branches: [main]
    # v1.25.4: no `labeled`. Gitea 1.27.1 sends every
    # label add AND remove as `label_updated`, and its matcher maps that to
    # `labeled` whichever label moved, with no `github.event.label` in the
    # payload. Each `task:*` or `code-review` change then started a run that
    # the `concurrency` block let cancel the PR's run in progress, and a run
    # whose jobs an `if:` skips would post `skipped` over the real run's
    # `CI / *` contexts, CI Gate included. An action outside `types` matches
    # nothing: no run, no status. The cost: adding `ci:full` waits for the
    # PR's next push or update-branch, or takes effect through
    # `workflow_dispatch`.
    # Handbook v1.35.3 (Software DS-8551) adds `ready_for_review`, so marking
    # a draft ready starts the Gate. A draft's run does nothing (v1.26), so
    # this run has no work in flight to cancel. test/ci_scripts_test.sh
    # holds this.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:                    # re-fire a whole workflow; also the
                                        # only retry when a run was never
                                        # created (see v1.3 correction above)
  # v1.23: main's full tier nightly as well as after every merge. Scheduled
  # runs are on the default branch. CUSTOMIZE: the hour, off nightly.yml's.
  # v1.29.3: one schedule run per repository (the concurrency group below),
  # and its bigdisk jobs skip while a main push run is in flight (the
  # schedule-guard job).
  schedule:
    - cron: '0 4 * * *'

# v1.26.2: on main the group is the workflow, the event and the commit sha,
# so each main run is its own group and a merge never cancels the main run in
# progress; a schedule or workflow_dispatch run is in its own event's group
# and never shares one with a push run (Company Agent m1167 (5), ruling 145,
# superseding v1.25's `main-{event}` group, m857 and m774 option (i)). Every
# other ref is one group, so a PR's newer run cancels the older. No
# expression reaches cancel-in-progress: Gitea 1.27.1 never released go-qrdb
# main run 57063, the first run after v1.22.1 set it to an expression
# (Company Agent m695).
# v1.29.3 (ruling 255(10)/(11)(c)): a schedule run's group is
# `schedule-{repository}`, with no sha, so a repository has one schedule run
# at a time. It is tested first, so a schedule run never takes a main group.
# The push, pull_request and workflow_dispatch groups do not change.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && format('schedule-{0}', github.repository) || github.ref == 'refs/heads/main' && format('main-{0}-{1}', github.event_name, github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CUSTOMIZE (Codex security P1s, 2026-11-12): the forge runners inject the
  # private-module credentials as GIT_CONFIG_COUNT, GIT_CONFIG_KEY_0 and
  # GIT_CONFIG_VALUE_0 (dependency-resolution.md §6). This repository has no
  # private modules, so these lines blank them for every step. That is
  # defence in depth for the trusted path (push, schedule and dispatch,
  # which run main's ci.yml) only. It is NOT a boundary for a pull request:
  # a pull_request run reads this file from the pull request, which can
  # delete these lines and add a step that reads the runner's values. Keeping
  # a credential from a pull request's job is the runner's responsibility (a
  # PR job runs on a runner provisioned with no credential), outside this
  # repository. The gomodauth.env files below carry GOPRIVATE alone, and
  # scripts/in-toolchain-image.sh forwards no credential into a container;
  # both are likewise defence in depth, not the isolation.
  GIT_CONFIG_COUNT: "0"
  GIT_CONFIG_KEY_0: ""
  GIT_CONFIG_VALUE_0: ""
  COVERAGE_THRESHOLD: 90      # CUSTOMIZE: per testing-guidelines.md
  # CUSTOMIZE (v1.9.2): the repo's full build-tag set, SPACE separated — the go
  # tool's own form. Leave EMPTY if no package is tag-gated. Every analysis step
  # below derives its own form from this ONE value; never write the tag list
  # twice. A tag-gated package that is not named here is analysed by NOTHING
  # while the gate still reports green (one repository had eight
  # such packages, including its whole WebAuthn implementation).
  GO_BUILD_TAGS: ""
  # v1.23: the full tier (ci-standard.md §8). Every event but pull_request
  # (push to main, schedule, workflow_dispatch), and a PR labelled ci:full.
  # Steps read it as env.CI_FULL_TIER; a job-level `if:` cannot read env, so
  # the integration job repeats this expression. Keep them equal.
  # v1.30 (fix 5): a workflow_dispatch off main is not the full tier (the
  # schedule guard refuses it and CI Gate fails).
  CI_FULL_TIER: ${{ (github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')) || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  # v1.24 (CA m749, m751 (a)): the files a docs-only PR may touch. CUSTOMIZE: narrow it
  # in a repo that embeds or generates from docs/ (go:embed, OpenAPI, protos).
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'
  # v1.30 (fix 3): a PR runs the lint-gates job only when a changed file
  # matches this extended regex. CUSTOMIZE: narrow it to what the repository's
  # lint-gates read (scripts, workflows, generated code, go.mod). The default
  # matches every file, so lint-gates runs on every PR.
  LINT_GATES_PATTERN: '.'
  # v1.26.1 (Company Agent m1128 (9)): the repository's releasability test, which
  # a docs-only PR still runs because make coverage skips on it. CUSTOMIZE: the
  # `go test` arguments, package and -run pattern (for example
  # `./pkg/labstrings -run '^TestTheTrackedTreeIsPubliclyReleasable$'`).
  # Empty means the repository has none. v1.31: this test names no internal
  # host, device, address or account; the internal names are checked by
  # releasability.yml from the private pattern file (the `releasability` job).
  RELEASABILITY_TEST: ""

jobs:
  # v1.34 (Company Agent m2211 item 2(b)): one preflight job instead of three.
  # `Changed files`, `Schedule guard` and `Architecture Gates` were three jobs,
  # each a hosted runner of its own on every run, in a saturated hosted queue.
  # They are steps of this one job now, in this order: the schedule guard
  # first, before anything is checked out, so AGENT_TOKEN (a schedule run and
  # a push to main only) still reaches a step beside no repository code; then
  # one checkout with persist-credentials false; then the changed-files step;
  # then the architecture gates. The four outputs are the same, read as
  # needs.preflight.outputs.*. A repository adopts v1.34 in one CI-file PR:
  # its CUSTOMIZE jobs read needs.preflight where they read needs.changes or
  # needs.schedule-guard, its own architecture steps move into this job, and
  # CI Gate checks `preflight` in place of the three. The comments of the
  # three former jobs follow.
  # v1.24 (CA m749, m751 (a)): a PR whose every changed file matches DOCS_ONLY_PATTERN
  # runs lint only; build and make coverage are skipped. Off pull_request, or
  # on a ci:full PR, docs_only is always false. Any doubt (a failed diff, an
  # empty list) reads as false, so the tier fails toward running the tests.
  # v1.29.3 (Company Agent ruling 255(10)/(11)(c)): one nightly per
  # repository, and none while main is busy. On a schedule run only, this job
  # asks the API whether this workflow has a push run on main in progress or
  # waiting, and sets `verdict`: `run` (none, or not a schedule run), `busy`
  # (one is) or `unreadable` (no count came back). On a schedule run every
  # bigdisk job runs only on `run`; CI Gate skips on `busy` and fails on
  # `unreadable`. The job runs on every event, not on schedule alone, so no
  # bigdisk job's `needs` meets a skipped job off schedule; off schedule it
  # makes no call. It checks nothing out, so no repository code runs beside
  # the tokens.
  # v1.30 (fixes 2, 3 and 5): two more verdicts. `refused`: a
  # workflow_dispatch off main (no full tier on a PR branch, ever) or a pull
  # request from a checkpoint branch (lane-ckpt/*); every job but the gate
  # skips and CI Gate fails. `proven`: on a push to main, the newest of this
  # workflow's last 20 successful runs whose head commit has this commit's tree
  # and whose Integration job succeeded (a ci:full PR run, a dispatch on main,
  # an earlier main run); the guard records its id as `proof`, every bigdisk
  # job but history-scan skips and CI Gate reads the skips as passed. The
  # proof compares trees, not commits, so history-scan runs on it anyway. A proof it cannot read
  # leaves `run`: the full tier runs. A schedule run never gets `proven`,
  # because its security stages read fresh vulnerability databases.
  # Architecture gate (v1.20, Company Agent m270 item 9; go-xkms arch-gates).
  # go-objstore owns every blob backend (docs/00), and a repo reaches it only
  # through the packages that are its storage seam. Test files are exempt, and
  # go-objstore itself passes. CUSTOMIZE: OBJSTORE_SEAMS, an extended regex of
  # the paths that may import go-objstore (go-xkms: 'pkg/ca/|pkg/storage/');
  # empty means none may. CUSTOMIZE: the repo's own layering rules (go-xkms:
  # xkmsctl and xkey depend only on sdk/go) are further steps in this job.
  # A source check with grep, not a stage: it runs on the runner's shell.
  # v1.23: a lint-class check, so it stays on the PR tier.
  preflight:
    name: Preflight [changed files, schedule guard, architecture gates]
    runs-on: ubuntu-latest
    # v1.26: a draft PR runs no CI; every job that needs this one skips with it.
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10       # v1.34: the three jobs had 5 each
    permissions:
      actions: read
      contents: read
    env:
      OBJSTORE_SEAMS: ''      # CUSTOMIZE
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      lint_gates: ${{ steps.diff.outputs.lint_gates }}   # v1.30
      verdict: ${{ steps.guard.outputs.verdict }}
      proof: ${{ steps.guard.outputs.proof }}   # v1.30
    steps:
      - name: Is a main push run of this workflow in flight?
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          SERVER: ${{ github.server_url }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.sha }}
          # This workflow's own file: the route counts its runs only.
          RUNS_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/workflows/ci.yml/runs
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          JOB_TOKEN: ${{ github.token }}
          # v1.30: a push to main reads the tree proof with it as well.
          BOT: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.AGENT_TOKEN || '' }}
        run: |
          set -uo pipefail
          # runs <token>: sets N to the number of this workflow's push runs
          # on main in progress or waiting. It returns 1, with the answer in
          # CODE, when a reply is not 200 with a count. The token reaches
          # curl as a header from a file descriptor, never on its command line.
          runs() {
            local st n
            N=0
            # v1.29.4: waiting is read before in_progress. A run only moves
            # waiting, then in_progress, then done, so one waiting at the
            # first query is still waiting, in progress or done at the
            # second, and counted or finished. The other order lets a run
            # start between the two queries and be counted by neither.
            for st in waiting in_progress; do
              CODE=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/runs.json" -w '%{http_code}' \
                -H @<(printf 'Authorization: token %s\n' "$1") \
                "$RUNS_API?event=push&branch=main&status=$st&limit=1") || CODE="curl exit $?"
              [ "$CODE" = 200 ] || return 1
              n=$(jq -er '.total_count | numbers' "$RUNNER_TEMP/runs.json") || { CODE="200 with no count"; return 1; }
              echo "$st: $n"
              N=$((N + n))
            done
          }
          # get <token> <url> <file>: 0 on a 200 reply, saved in <file>.
          get() {
            [ "$(curl -sS --max-time 30 -o "$3" -w '%{http_code}' \
              -H @<(printf 'Authorization: token %s\n' "$1") "$2")" = 200 ]
          }
          # v1.30: proof <token>: sets PROOF to the id of the newest of this
          # workflow's last 20 successful runs whose head commit has this
          # commit's tree and whose Integration jobs all succeeded (at least
          # one). It returns 1 when a reply is not 200, and 0 with PROOF
          # empty when no run proves the tree.
          proof() {
            local tree id sha t
            PROOF=
            get "$1" "$REPO_API/git/commits/$SHA" "$RUNNER_TEMP/c.json" || return 1
            tree=$(jq -er '.commit.tree.sha' "$RUNNER_TEMP/c.json") || return 1
            get "$1" "$RUNS_API?status=success&limit=20" "$RUNNER_TEMP/ok.json" || return 1
            while read -r id sha; do
              get "$1" "$REPO_API/git/commits/$sha" "$RUNNER_TEMP/c.json" || continue
              t=$(jq -r '.commit.tree.sha' "$RUNNER_TEMP/c.json")
              [ "$t" = "$tree" ] || continue
              get "$1" "$REPO_API/actions/runs/$id/jobs?limit=100" "$RUNNER_TEMP/j.json" || continue
              if jq -e '[.jobs[] | select(.name | startswith("Integration"))] | length > 0 and all(.conclusion == "success")' \
                   "$RUNNER_TEMP/j.json" >/dev/null; then
                PROOF=$id
                echo "tree $tree: run $id (head $sha) has a green full tier"
                return 0
              fi
            done < <(jq -r '.workflow_runs[]? | "\(.id) \(.head_sha)"' "$RUNNER_TEMP/ok.json")
            echo "tree $tree: no green full-tier run among the last 20 successful runs"
          }
          verdict=run N=0 PROOF=
          # v1.30 (fixes 3 and 5): the refusals come first.
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            verdict=refused
            echo "::error::workflow_dispatch on $REF: the full tier runs on main only, never on a PR branch (ci-template v1.30); every job skips and CI Gate fails"
          elif [ "$EVENT" = pull_request ] && [ "${HEAD_REF#lane-ckpt/}" != "$HEAD_REF" ]; then
            verdict=refused
            echo "::error::a pull request from checkpoint branch $HEAD_REF: a checkpoint branch never opens a PR (ci-template v1.30); every job skips and CI Gate fails"
          fi
          if [ "$verdict" != run ]; then
            :
          elif [ "$EVENT" != schedule ]; then
            echo "not a schedule run: no check"
          elif [ "$SERVER" = https://github.com ]; then
            echo "the github.com mirror has no bigdisk runner: no check"
          elif [ -n "$JOB_TOKEN" ] && runs "$JOB_TOKEN"; then
            echo "read with the job token"
          elif job="${CODE:-no job token}"; [ -n "$BOT" ] && runs "$BOT"; then
            echo "read with AGENT_TOKEN; the job token got: $job"
          else
            bot="not set"; [ -z "$BOT" ] || bot="$CODE"
            verdict=unreadable
            echo "::error::the Actions API gave no count (job token: $job; AGENT_TOKEN: $bot), so every bigdisk job skips and CI Gate fails"
          fi
          if [ "$verdict" = run ] && [ "$N" -gt 0 ]; then
            verdict=busy
            echo "::notice::$N push run(s) of this workflow on main in flight: this schedule run skips its bigdisk jobs, and CI Gate posts skipped"
          fi
          # v1.30 (fix 2): the tree proof, on a push to main on the forge only.
          if [ "$verdict" = run ] && [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && [ "$SERVER" != https://github.com ]; then
            if { [ -n "$JOB_TOKEN" ] && proof "$JOB_TOKEN"; } || { [ -n "$BOT" ] && proof "$BOT"; }; then
              if [ -n "$PROOF" ]; then
                verdict=proven
                echo "::notice::this tree already has a green full tier in run $PROOF: the bigdisk jobs but the history secret scan skip, and CI Gate passes on it"
              fi
            else
              echo "::warning::the tree proof could not be read: the full tier runs"
            fi
          fi
          echo "verdict: $verdict${PROOF:+ (proof: run $PROOF)}"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "proof=$PROOF" >> "$GITHUB_OUTPUT"

      # v1.34: the full history on a PR run for the changed-files diff, one
      # commit otherwise. No credential is left in the checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: ${{ (github.event_name == 'pull_request' && env.CI_FULL_TIER != 'true') && '0' || '1' }}
          persist-credentials: false

      - name: Is every changed file docs or markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # v1.30: lint_gates is false only on a PR whose changed files all
          # miss LINT_GATES_PATTERN; any doubt runs the job.
          docs_only=false lint_gates=true
          if [ "$EVENT" = pull_request ] && [ "$CI_FULL_TIER" != true ]; then
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$DOCS_ONLY_PATTERN"; then
                docs_only=true
              fi
              printf '%s\n' "$files" | grep -qE "$LINT_GATES_PATTERN" || lint_gates=false
              printf '%s\n' "$files"
            fi
          fi
          echo "docs only: $docs_only; lint-gates: $lint_gates"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "lint_gates=$lint_gates" >> "$GITHUB_OUTPUT"

      - name: No direct go-objstore import outside the storage seam
        run: |
          if [ "$(sed -n 's/^module //p' go.mod)" = github.com/jeremyhahn/go-objstore ]; then
            echo "OK: this is go-objstore"; exit 0
          fi
          hits=$(grep -rln --include='*.go' '"github.com/jeremyhahn/go-objstore' . \
                 | grep -v '_test\.go$' \
                 | { if [ -n "$OBJSTORE_SEAMS" ]; then grep -vE "$OBJSTORE_SEAMS"; else cat; fi; } || true)
          if [ -n "$hits" ]; then
            echo "go-objstore may be imported only in the storage seam (OBJSTORE_SEAMS='$OBJSTORE_SEAMS'):"
            echo "$hits"; exit 1
          fi
          echo "OK: no go-objstore import outside the storage seam"

  # v1.30 (fix 1): the toolchain image is built once per content hash, here,
  # and every other job pulls it (scripts/ci-image-cache.sh v1, ships beside
  # this file). On a push to main only, on the release runner, which alone
  # holds the registry credential (rulings 169 and 173): when the registry
  # lacks `<repo>-toolchain:<hash>-main` under CI_IMAGE_NAMESPACE, it builds
  # the image and pushes it; otherwise it does nothing. v5 of the script
  # builds straight to the registry and checks the pushed digest, and every
  # trusted pull reads its digest from the registry. Both need the runner's
  # docker buildx plugin. Without it publish fails, and a pull falls back to
  # the local build. The integration image
  # stays keyed by the tree (ruling 220(5)) and is built where it runs.
  # This job is not in CI Gate's needs: a registry fault must not turn main
  # red, and every consumer falls back to a local build. CUSTOMIZE: a
  # repository whose forge has no `release` runner sets `if: false` and says
  # so in its adoption PR, because a job no runner takes keeps the run in
  # progress and the schedule guard reads main as busy.
  publish-images:
    name: Publish CI images
    runs-on: release
    if: ${{ github.server_url != 'https://github.com' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 60       # CUSTOMIZE: ceil(1.5 x a cold toolchain build's p95)
    env:
      CI_IMAGE_NAMESPACE: ${{ vars.CI_IMAGE_NAMESPACE }}   # m2101: a repository variable; ci-standard.md §9 (ruling 217(4))
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Publish the toolchain image when the registry lacks its hash
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          scripts/ci-image-cache.sh publish ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # v1.30 (fix 1, parallel jobs; fix 5, gosec on the PR tier): the
  # lint-class stages, moved from the image job, in a job of their own that
  # needs the toolchain image alone, so they run beside build and make
  # coverage and not in series before them. The PR tier runs `make gosec`
  # here; the full tier runs gosec in the image job's `make security`, so it
  # runs once per event. It runs on a docs-only PR, as lint did.
  lint:
    name: Lint [lint, gosec, deps-check, build tags]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    needs: preflight   # v1.34
    if: ${{ !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    timeout-minutes: 30       # CUSTOMIZE: ceil(1.5 x this job's 72-hour p95), ci-standard.md §12
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
      CI_IMAGE_NAMESPACE: ${{ vars.CI_IMAGE_NAMESPACE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # v1.30 (fix 1): the registry cache first. A miss, or an unreachable
      # registry, falls through to the local build below.
      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      # v1.30: the toolchain image alone (`make docker-build-toolchain`,
      # devcontainer.md §6), which skips when the daemon holds its tag.
      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4: Athens first, as in the image job.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          # trusted-imx95: on a trusted run, the image ID the build recorded
          # (Makefile, toolchain-ref), so no later step resolves a tag.
          ref=$(make -s toolchain-ref)
          echo "TOOLCHAIN_IMAGE=$ref" >> "$GITHUB_ENV"

      # v1.22: bound this repo's cache volumes (as in the image job). It never
      # fails the job and keeps every volume a container mounts.
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # make lint: gofmt, vet, golangci-lint, actionlint with shellcheck
      # (devops.md §4). .golangci.yml enables staticcheck, errcheck, unused,
      # ineffassign, misspell and gocritic (devops.md §8). v1.27: a repo's
      # `make lint-gates` runs in the lint-gates job beside this one, never
      # here and never as a prerequisite of lint. v1.30: in this job, moved
      # from the image job.
      - name: make lint
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # trusted-imx95 (security finding on #19): the internal-name gate's
      # private-pattern step left this job. A `pull_request` run executes the
      # pull request's own copy of this file, so the step handed the private
      # pattern secret to whatever the pull request wrote into it. The scan
      # is now releasability.yml, on pull_request_target from the base
      # branch; the `releasability` job below reads its result and CI Gate
      # requires it. This file names that secret nowhere.

      # v1.26.1 (Company Agent m1128 (9)): a docs-only PR skips make coverage, so
      # it runs the releasability test alone; any other run gets it from make
      # coverage.
      - name: Releasability test (docs-only PR)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.RELEASABILITY_TEST != '' && needs.preflight.outputs.docs_only == 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "go test -count=1 -tags '$GO_BUILD_TAGS' $RELEASABILITY_TEST"

      # v1.9.2, now in the image: the declared tag set must select code. Each
      # tag is checked by removal: if dropping it changes no selected file
      # (tests included), it is misspelled or dead. Compares files, not
      # packages, and a tag may swap files (a `!foo` stub for a `foo` body).
      - name: Assert every build tag selects code
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.GO_BUILD_TAGS != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "GO_BUILD_TAGS='$GO_BUILD_TAGS' sh scripts/assert-build-tags.sh"

      # v1.30 (fix 5): gosec on the PR tier, through the developers' target,
      # with no network. On the full tier make security runs it in the image job.
      # CUSTOMIZE: here gosec is the CST guard and the tree secret scan, and a
      # docs-only change can carry a credential, so it runs on a docs-only PR
      # too, and on any docs-only event, when the image job skips.
      - name: make gosec (PR tier)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && (env.CI_FULL_TIER != 'true' || needs.preflight.outputs.docs_only == 'true') }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make gosec GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # Fails when a library, first-party or third-party, is behind its latest
      # release without devops.md §9's documented reason (ci-standard.md §1).
      # v1.28: a lint-class gate of seconds on the PR tier, every event, a
      # docs-only PR included (ruling 219(3)); it was full tier only from v1.23.
      - name: make deps-check
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make deps-check

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # trusted-imx95 (from a Codex security review): the history secret scan
  # runs on every push and pull request, whether or not the tree proof is
  # reused. The proof compares trees only: two commits that add a credential
  # and then remove it leave the tree of a run already proven green, and on
  # that push the `proven` verdict skips the image job and its make security.
  # This job runs `make secret-scan-history` (scripts/secret-scan.sh history)
  # over the full history on the `run` and `proven` verdicts alike, and CI
  # Gate checks it as `always`: a skip fails the gate on any verdict. On a
  # pull request it scans the merge commit's history, so the commits a PR
  # adds are scanned before they reach main, not only its final tree.
  # A schedule run while main is busy skips it with the gate, and a draft or
  # a refused run fails the gate anyway.
  history-scan:
    name: History secret scan [secret-scan history]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    needs: preflight
    if: ${{ !github.event.pull_request.draft && (needs.preflight.outputs.verdict == 'run' || needs.preflight.outputs.verdict == 'proven') }}
    timeout-minutes: 30       # CUSTOMIZE: ceil(1.5 x this job's 72-hour p95), ci-standard.md §12
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
      CI_IMAGE_NAMESPACE: ${{ vars.CI_IMAGE_NAMESPACE }}
    steps:
      # The full history: a shallow checkout hides a credential committed and
      # removed earlier, and the scan refuses one.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Mask the forge credentials before any other step (as in the lint job).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      # The toolchain image alone, as in the lint job; on a proven push the
      # registry cache normally holds it.
      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          ref=$(make -s toolchain-ref)
          echo "TOOLCHAIN_IMAGE=$ref" >> "$GITHUB_ENV"

      # No network: gitleaks reads the history the checkout streams in.
      - name: make secret-scan-history
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make secret-scan-history

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # v1.21: every stage runs in the project's own devcontainer image and no
  # other (ci-standard.md §2, devcontainer.md §7). One image job (Company Agent
  # m601 (a)) builds the images once from build/docker/devcontainer/Dockerfile
  # at this commit (`make docker-build`) and runs each stage's `make` target in
  # the toolchain image as its own step, through scripts/in-toolchain-image.sh
  # (ships beside this file), which copies the checkout into the container: a
  # runner reaches its daemon through a socket, so a bind mount would resolve
  # on the daemon's host. A failed step names its stage; `if: !cancelled()`
  # runs every stage after a failed one, so one run reports them all.
  #
  # No job installs a Go toolchain or a tool on the runner: the image's pin file
  # (devcontainer.md §2) decides every version, and the Makefile carries every
  # flag set (devops.md §4; §8: CI runs gosec through the developers' target).
  # GO_BUILD_TAGS reaches every target as a make variable, so the tag set is
  # still written once. build, test and lint run with no network, on the
  # image's module cache; security and deps-check get one (IN_IMAGE_NETWORK=
  # bridge) for the vulnerability databases and the module proxy.
  #
  # v1.23: lint, assert-build-tags, build and coverage are the PR tier and run
  # on every event. security and trivy image are full tier only
  # (env.CI_FULL_TIER): main after every merge, nightly, dispatch, ci:full.
  # v1.28: deps-check is a lint-class gate on the PR tier and runs on every
  # event (ruling 219(3)).
  #
  # v1.22: every stage mounts the build and golangci-lint cache volumes, and a
  # bridge stage the module cache volume, from the runner's Docker host
  # (in-toolchain-image.sh v2, ci-standard.md §6), so a stage writes its
  # caches there and not into its container's layer.
  #
  # v1.29 (Company Agent ruling 220(5)): the job reads the Alpine package
  # indexes the build resolves against (scripts/apk-index-sum.sh, ships beside
  # this file) into APK_INDEX_SUM, which the integration image's tag hashes and
  # its build takes as a build argument (ci-standard.md §9, devcontainer.md
  # §6). A new Alpine package release, a CVE fix among them, changes the tag,
  # so the next run rebuilds the image rather than reuse a cached one with the
  # old package (go-enclave main fd83b79ce, CVE-2026-92392).
  #
  # The forge credentials reach the image build only as the gomodauth BuildKit
  # secret, from a file outside the context that the job removes.
  # No step and no make target prints that file, the job environment (`env`,
  # `printenv`, `set -x`) or a matched line: `make stage-gomodauth` and the
  # file writes run silent, and lint steps and `make check-public-literals`
  # report path and line only (ci-standard.md §5, Company Agent m605 item 8).
  #
  # Runners: the image and integration jobs run on bigdisk (Docker and the disk
  # for the image builds) and CI Gate on ci-gate; on the github.com mirror all
  # are ubuntu-latest, which has Docker (devops.md §1: host-specific choices
  # are guarded on github.server_url).
  #
  # v1.30: lint, the build-tag assertion, the releasability test and
  # deps-check moved to the lint job. This job runs build, make coverage and,
  # on the full tier, make security and trivy image; it skips on a docs-only
  # PR, which runs none of them, and CI Gate reads that skip as passed.
  image:
    name: Devcontainer image [build, test, security, trivy image]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    needs: preflight   # v1.24 (CA m749, m751 (a)); v1.29.3; v1.34
    # v1.29.3: on a schedule run, only on the schedule guard's `run`. v1.30:
    # on every event only on `run` (not `refused`, not `proven`), and never
    # on a docs-only PR.
    if: ${{ needs.preflight.outputs.verdict == 'run' && needs.preflight.outputs.docs_only != 'true' }}
    timeout-minutes: 90       # CUSTOMIZE: ceil(1.5 x this job's 72-hour p95), ci-standard.md §12
    env:
      CI_IMAGE_NAMESPACE: ${{ vars.CI_IMAGE_NAMESPACE }}   # v1.30; m2101
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # v1.22: the cache volumes' trust class. Only a push to main writes the
      # caches main's build reads; every other event, pull requests included,
      # gets the `pr` set (ci-standard.md §6). v1.23: the nightly schedule runs
      # on main, so it writes main's set too.
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        # CUSTOMIZE: full history. make security scans every commit
        # (scripts/secret-scan.sh history), and a shallow checkout hides a
        # secret committed and removed earlier; the scan refuses one.
        with:
          fetch-depth: 0

      # v1.21.1 (Company Agent m605 item 8): mask the forge credentials before
      # any other step. The runner injects them as plain environment
      # (dependency-resolution.md §6), which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.23 (Company Agent m674 item 3, 2026-10-18): the integration image is named by its content,
      # <repo>-ci-it:<hash> (`make -s it-image`, ci-standard.md §9), so every
      # job of every run on this runner names the same image for the same
      # tree, builds it once and reuses it. No job removes it; the reap step does.
      # v1.29 (ruling 220(5)): the Alpine package index checksum joins the
      # integration image's tag hash (scripts/apk-index-sum.sh). A base image
      # the script cannot read fails the step.
      - name: Read the Alpine package index
        run: |
          sum=$(scripts/apk-index-sum.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # CUSTOMIZE: host tuning a test needs (e.g. QUIC UDP buffers:
      # sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032)
      # goes here; the container shares the runner's kernel.

      # v1.30 (fix 1): the toolchain image from the registry cache first, so
      # make docker-build builds the integration image alone.
      - name: Pull the toolchain image from the registry cache
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the devcontainer images
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4: the build's module fetches go through Athens first when
          # the runner sets DEVCACHE_GOPROXY and the cache answers, with the
          # proxy.golang.org fallback. v1.29.5: the separator is `|`, so any
          # error falls through, and "$bp" is one quoted make argument; the
          # Makefile quotes it on the docker build line.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          # trusted-imx95: on a trusted run, the image ID the build recorded
          # (Makefile, toolchain-ref), so no later step resolves a tag.
          ref=$(make -s toolchain-ref)
          echo "TOOLCHAIN_IMAGE=$ref" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      # v1.25.1 (2026-10-20, from a Codex review): the lease is bounded and
      # never skipped. v1.23 leased only an image it found, so an
      # image reaped before the lease (or a failed `docker create`) left the
      # job running unleased and green. Now the step inspects the image, leases
      # it by id (--pull never), and inspects the tag again for the same id. If
      # the image is gone at either inspect it builds it once with
      # `make docker-build`, leases and inspects again, and fails the step if
      # it is still missing. A missing image is never a success.
      # v1.25.2 (2026-10-21, from a Codex review): the lease holds the image
      # id, not the tag. Two trees that differ only in a file the build ignores
      # share one image id under two tags, and `docker image rm <tag>` untags
      # such an image even while a container uses it. The step exports the
      # leased id as IT_LEASE_ID, and every later step that names IT_IMAGE
      # (docker save, make integration-test, each soak iteration) first runs
      # `docker tag "$IT_LEASE_ID" "$IT_IMAGE"`, which puts back a tag a
      # reaper removed before the lease. docker save keeps the tag, so the
      # archive keeps its repo tag. reap-stale-ci-stacks.sh v4 also keeps
      # every tag of an id a container uses.
      # v1.25.3 (2026-10-21, from a Codex review): the inspect, lease and
      # second inspect run under the daemon's image lock, a created container
      # named <prefix>image-lock (reap-stale-ci-stacks.sh v5 takes it around
      # its check and removal), so no reaper removes the tag between them. The
      # rebuild runs without it. The step writes image_lock and image_unlock
      # to $RUNNER_TEMP/image-lock.sh, and each re-tag takes the lock too. A
      # lock created more than 600 s ago is removed by its id; a step waits
      # 660 s for the lock and then fails.
      - name: Lease the integration image
        run: |
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          # v1.25.3: the daemon's image lock, shared with the reaper (v5) and
          # every re-tag. The next steps source these from image-lock.sh.
          image_lock() {
            local lock="${CI_STACK_PREFIX}image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          declare -f image_lock image_unlock > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          # trusted-imx95: the reference is `make -s it-ref`, on a trusted run
          # the ID this job's build recorded; with none yet, the build below records it.
          take_lease() {
            ref=$(make -s it-ref IT_IMAGE="$IT_IMAGE" 2>/dev/null) || return 1
            id=$(docker image inspect -f '{{.Id}}' "$ref" 2>/dev/null) || return 1
            docker create --pull never --name "$lease" "$id" true >/dev/null || return 1
            [ "$(docker image inspect -f '{{.Id}}' "$ref" 2>/dev/null)" = "$id" ] && return 0
            docker rm "$lease" >/dev/null 2>&1 || true
            return 1
          }
          image_lock || exit 1
          if ! take_lease; then
            image_unlock
            echo "integration image $IT_IMAGE is missing or went before its lease; building it once"
            ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
              for v in GOPRIVATE; do
                if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
              done )
            # v1.29.4: Athens first, as in the image job's build step.
            bp=
            if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
              bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
            fi
            rc=0
            make docker-build ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE" || rc=$?
            rm -f "$RUNNER_TEMP/gomodauth.env"
            if [ "$rc" -ne 0 ]; then
              echo "::error::building the integration image $IT_IMAGE failed (exit $rc)"
              exit "$rc"
            fi
            image_lock || exit 1
            if ! take_lease; then
              echo "::error::the integration image $IT_IMAGE is missing after one rebuild, so this job holds no lease on it"
              exit 1
            fi
          fi
          image_unlock
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"

      # v1.22: bound this repo's cache volumes on the host before the stages
      # add to them (ci-standard.md §6). It never fails the job.
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # CUSTOMIZE: nested modules (sdk/go, xkey) and variants (FIPS) are built
      # by `make build` itself, never by an extra step here.
      - name: make build
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make build GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # The test stage (m601 (c)): make coverage runs the whole unit suite with
      # -race (make test's flags), the PR tier's unit test and race checks in
      # one run (v1.23), and fails when total coverage is below
      # COVERAGE_THRESHOLD (testing-guidelines.md), so the suite runs once.
      # Tags matter here too: without them tag-gated packages are neither
      # tested nor counted. The integration stage is its own job below.
      - name: make coverage (unit tests and the threshold)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make coverage GO_BUILD_TAGS='$GO_BUILD_TAGS' COVERAGE_THRESHOLD=$COVERAGE_THRESHOLD"

      # make security: gosec, govulncheck, go mod verify (devops.md §8), with
      # trivy fs per the phase (§8a). The target owns gosec's flags and its
      # memory bounds (GOMEMLIMIT, GOMAXPROCS, -concurrency; v1.6 to v1.8) and
      # reports a kill by signal as a kill, not a finding. Nothing is uploaded
      # to code scanning (m601 (d): CI runs on Gitea).
      - name: make security
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make security GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # The integration image is gated before any push to either registry
      # (devops.md §8): --ignore-unfixed (v1.19) and --skip-dirs /opt/go/mod
      # (v1.20). trivy fs and make security never take --ignore-unfixed.
      # A PR builds no image for a registry, so the scan is full tier (v1.23).
      - name: trivy image (integration image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          . "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          image_lock || exit 1
          docker tag "$IT_LEASE_ID" "$IT_IMAGE"
          image_unlock
          # trusted-imx95: the leased ID, so the scan reads the image the job
          # holds even if another job moves the tag after the re-tag above.
          docker save -o it-image.tar "$IT_LEASE_ID"
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
            trivy image --input it-image.tar --ignore-unfixed --skip-dirs /opt/go/mod --severity CRITICAL,HIGH --exit-code 1

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env" it-image.tar
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # v1.27 (Company Agent m1192 (6), item 27): a repository's `make lint-gates`
  # (its own gates beside `make lint`: script, workflow, generated-code and
  # module checks) runs in this job, in parallel with the image job's
  # `make lint`, not in series after it, so Lint's wall time is the longer of
  # the two and not their sum. It runs only when the Makefile (or a tracked
  # *.mk) defines a lint-gates target; a repository without one gets an OK and
  # a green job, with no image built. `make lint` and `go vet` stay where they
  # are. A repository whose `make lint` lists lint-gates as a prerequisite
  # removes it from lint in the PR that adopts v1.27, or the gates run twice.
  # The toolchain image comes from `make docker-build`, as in the image job,
  # which builds only a tag the daemon does not already hold (devcontainer.md
  # §6). A lint-class check, so it is on the PR tier and runs on a docs-only PR.
  # v1.29.1 (ruling 226(15), 108 repair): the step fails fast. `make
  # lint-gates` runs without `-k`, so the first failing gate ends the step
  # and the job; the gates after it run on the next push.
  lint-gates:
    name: Lint Gates [toolchain image]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    needs: preflight     # v1.29.3; v1.30; v1.34
    # v1.26: never on a draft. v1.29.3: on a schedule run, only on the
    # schedule guard's `run`. v1.30: only on `run` on every event, and on a PR
    # only when a changed file matches LINT_GATES_PATTERN (fix 3).
    if: ${{ !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' && needs.preflight.outputs.lint_gates != 'false' }}
    timeout-minutes: 45       # CUSTOMIZE: ceil(1.5 x this job's 72-hour p95), ci-standard.md §12
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # v1.22: the cache volumes' trust class (as in the image job).
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
      CI_IMAGE_NAMESPACE: ${{ vars.CI_IMAGE_NAMESPACE }}   # v1.30; m2101
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A source check on the runner's shell: no make recipe runs here.
      - name: Does the Makefile define lint-gates?
        id: probe
        run: |
          mapfile -t mk < <(git ls-files -- Makefile '*.mk')
          if [ "${#mk[@]}" -gt 0 ] && grep -qE '^lint-gates[[:space:]]*:([^=]|$)' "${mk[@]}"; then
            echo "lint-gates target found"
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: no lint-gates target in the Makefile; nothing to run"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reap stale CI stacks
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.30 (fix 1): the registry cache first, then the toolchain image
      # alone (`make docker-build-toolchain`); this job never builds the
      # integration image.
      - name: Pull the toolchain image from the registry cache
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: scripts/ci-image-cache.sh pull || true

      - name: Build the toolchain image
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4: Athens first, as in the image job.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          # trusted-imx95: on a trusted run, the image ID the build recorded
          # (Makefile, toolchain-ref), so no later step resolves a tag.
          ref=$(make -s toolchain-ref)
          echo "TOOLCHAIN_IMAGE=$ref" >> "$GITHUB_ENV"

      # v1.22: bound this repo's cache volumes (as in the image job). It never
      # fails the job and keeps every volume a container mounts.
      - name: Trim the CI caches
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # v1.29.1: no -k; the first failing gate ends the step (ruling 226(15)).
      - name: make lint-gates
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: none   # CUSTOMIZE: bridge when a gate needs the module proxy or a network
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint-gates GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # Integration tests run in the integration image (ci-standard.md §2), as a
  # compose stack on the runner host started by `make integration-test`. The
  # stack is named per run under the repo's prefix, the job reaps stale stacks
  # first (v1.18) and keeps its own teardown last under `if: always()`.
  # v1.23: full tier only (CI_FULL_TIER's expression); never on a plain PR.
  integration:
    name: Integration [integration image]
    # v1.26: never on a draft PR, ci:full or not. v1.29.3: on a schedule run,
    # only on the schedule guard's `run`. v1.30: only on `run` on every event
    # (a proven main push and a refused run skip it).
    needs: preflight   # v1.34
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    timeout-minutes: 60       # CUSTOMIZE: ceil(1.5 x this job's 72-hour p95), ci-standard.md §12
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      IT_PROJECT: ${{ github.event.repository.name }}-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Company Agent m605 item 8): mask the forge credentials before
      # any other step. The runner injects them as plain environment
      # (dependency-resolution.md §6), which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.29: the Alpine package index checksum (as in the image job).
      - name: Read the Alpine package index
        run: |
          sum=$(scripts/apk-index-sum.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      # v1.23: the content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      # v1.25.1: bounded, building the image once if it is missing (as in the
      # image job); a missing image fails the step.
      # v1.25.2: exports the leased id as IT_LEASE_ID, which the suite's step
      # tags as IT_IMAGE before it runs (as in the image job).
      # v1.25.3: the lease and the re-tag run under the image lock (as in the
      # image job).
      - name: Lease the integration image
        run: |
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          # v1.25.3: the daemon's image lock, shared with the reaper (v5) and
          # every re-tag. The next steps source these from image-lock.sh.
          image_lock() {
            local lock="${CI_STACK_PREFIX}image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          declare -f image_lock image_unlock > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          # trusted-imx95: the reference is `make -s it-ref`, on a trusted run
          # the ID this job's build recorded; with none yet, the build below records it.
          take_lease() {
            ref=$(make -s it-ref IT_IMAGE="$IT_IMAGE" 2>/dev/null) || return 1
            id=$(docker image inspect -f '{{.Id}}' "$ref" 2>/dev/null) || return 1
            docker create --pull never --name "$lease" "$id" true >/dev/null || return 1
            [ "$(docker image inspect -f '{{.Id}}' "$ref" 2>/dev/null)" = "$id" ] && return 0
            docker rm "$lease" >/dev/null 2>&1 || true
            return 1
          }
          image_lock || exit 1
          if ! take_lease; then
            image_unlock
            echo "integration image $IT_IMAGE is missing or went before its lease; building it once"
            ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
              for v in GOPRIVATE; do
                if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
              done )
            # v1.29.4: Athens first, as in the image job's build step.
            bp=
            if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
              bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
            fi
            rc=0
            make docker-build ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE" || rc=$?
            rm -f "$RUNNER_TEMP/gomodauth.env"
            if [ "$rc" -ne 0 ]; then
              echo "::error::building the integration image $IT_IMAGE failed (exit $rc)"
              exit "$rc"
            fi
            image_lock || exit 1
            if ! take_lease; then
              echo "::error::the integration image $IT_IMAGE is missing after one rebuild, so this job holds no lease on it"
              exit 1
            fi
          fi
          image_unlock
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"

      # CUSTOMIZE: host tuning the suite needs goes here, as in the test job.

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      - name: make integration-test (integration image)
        run: |
          . "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          image_lock || exit 1
          docker tag "$IT_LEASE_ID" "$IT_IMAGE"
          image_unlock
          make integration-test MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PROJECT="$IT_PROJECT" IT_IMAGE="$IT_IMAGE" IT_IMAGE_ID="$IT_LEASE_ID" GO_BUILD_TAGS="$GO_BUILD_TAGS"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$IT_PROJECT" down --volumes || true
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # Soak (v1.23, owner item 101): the integration suite looped in the
  # integration image until SOAK_MINUTES have passed, each iteration its own
  # compose stack, torn down before the next; the first red iteration fails
  # the job. v1.24 (owner ruling 2026-10-19, Company Agent m751 (e)): nightly
  # and workflow_dispatch only, off main pushes and off ci:full; the Gate marks
  # it `nightly`. It replaces nothing in batch.yml, whose soak stays a dispatch.
  soak:
    name: Soak [integration image]
    # v1.29.3: on a schedule run, only on the schedule guard's `run`.
    needs: preflight   # v1.34
    # v1.30: a dispatch off main is refused, so soak runs only on `run`.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.preflight.outputs.verdict == 'run' }}
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    timeout-minutes: 90       # CUSTOMIZE: SOAK_MINUTES plus one iteration, at least ceil(1.5 x the 72-hour p95)
    env:
      SOAK_MINUTES: 30        # CUSTOMIZE
      SOAK_TARGET: integration-test   # CUSTOMIZE: a make target of the integration image
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      IT_PROJECT: ${{ github.event.repository.name }}-ci-${{ github.run_id }}-${{ github.run_attempt }}-soak
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.29: the Alpine package index checksum (as in the image job).
      - name: Read the Alpine package index
        run: |
          sum=$(scripts/apk-index-sum.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      # v1.23: the content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      # v1.25.1: bounded, building the image once if it is missing (as in the
      # image job); a missing image fails the step.
      # v1.25.2: exports the leased id as IT_LEASE_ID, which the suite's step
      # tags as IT_IMAGE before it runs (as in the image job).
      # v1.25.3: the lease and the re-tag run under the image lock (as in the
      # image job).
      - name: Lease the integration image
        run: |
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          # v1.25.3: the daemon's image lock, shared with the reaper (v5) and
          # every re-tag. The next steps source these from image-lock.sh.
          image_lock() {
            local lock="${CI_STACK_PREFIX}image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          declare -f image_lock image_unlock > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          # trusted-imx95: the reference is `make -s it-ref`, on a trusted run
          # the ID this job's build recorded; with none yet, the build below records it.
          take_lease() {
            ref=$(make -s it-ref IT_IMAGE="$IT_IMAGE" 2>/dev/null) || return 1
            id=$(docker image inspect -f '{{.Id}}' "$ref" 2>/dev/null) || return 1
            docker create --pull never --name "$lease" "$id" true >/dev/null || return 1
            [ "$(docker image inspect -f '{{.Id}}' "$ref" 2>/dev/null)" = "$id" ] && return 0
            docker rm "$lease" >/dev/null 2>&1 || true
            return 1
          }
          image_lock || exit 1
          if ! take_lease; then
            image_unlock
            echo "integration image $IT_IMAGE is missing or went before its lease; building it once"
            ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
              for v in GOPRIVATE; do
                if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
              done )
            # v1.29.4: Athens first, as in the image job's build step.
            bp=
            if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
              bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
            fi
            rc=0
            make docker-build ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE" || rc=$?
            rm -f "$RUNNER_TEMP/gomodauth.env"
            if [ "$rc" -ne 0 ]; then
              echo "::error::building the integration image $IT_IMAGE failed (exit $rc)"
              exit "$rc"
            fi
            image_lock || exit 1
            if ! take_lease; then
              echo "::error::the integration image $IT_IMAGE is missing after one rebuild, so this job holds no lease on it"
              exit 1
            fi
          fi
          image_unlock
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"

      # CUSTOMIZE: host tuning the suite needs goes here, as in the test job.

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      - name: Soak (integration suite, looped)
        run: |
          . "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          deadline=$(( $(date +%s) + SOAK_MINUTES * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            p="$IT_PROJECT-$i"
            echo "$p" > "$RUNNER_TEMP/soak-project"
            echo "soak iteration $i"
            image_lock || exit 1
            docker tag "$IT_LEASE_ID" "$IT_IMAGE"
            image_unlock
            rc=0
            make "$SOAK_TARGET" MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PROJECT="$p" IT_IMAGE="$IT_IMAGE" IT_IMAGE_ID="$IT_LEASE_ID" GO_BUILD_TAGS="$GO_BUILD_TAGS" || rc=$?
            IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$p" down --volumes || true
            if [ "$rc" -ne 0 ]; then
              echo "::error::soak iteration $i failed (exit $rc)"
              exit "$rc"
            fi
          done
          echo "soak: $i iterations in $SOAK_MINUTES min, all green"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          if [ -s "$RUNNER_TEMP/soak-project" ]; then
            IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$(cat "$RUNNER_TEMP/soak-project")" down --volumes || true
          fi
          rm -f "$RUNNER_TEMP/soak-project"
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # CUSTOMIZE: further stages run in the image job as steps of the same
  # shape (one `make` target in the toolchain image, `if: !cancelled()`). A
  # suite that needs its own runner or stack (tagged suites, cross-arch,
  # contrib modules) is a job of the integration job's shape and joins CI
  # Gate's needs list and check lines. v1.23: such a suite is full tier (the
  # integration job's `if:`, `full` in CI Gate) unless it is lint, build,
  # unit or race, which stay on the PR tier.
  # v1.29.2 (ruling 239(8)): a CUSTOMIZE job that runs only when certain
  # paths change (the changes job gains an output for them, `optee` here)
  # needs the image job as well, and its `if:` tests an image job output
  # that its build step sets (here `built`, which the image job declares in
  # `outputs:` when a repository adds such a job), never `needs.<job>.result`
  # and never the changes job's outputs alone. Reading `needs.preflight.outputs.*`
  # in the same `if:` is fine:
  #   needs: [preflight, image]
  #   if: ${{ !cancelled() && needs.image.outputs.built == 'true' && !github.event.pull_request.draft && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.preflight.outputs.optee == 'true')) }}
  # v1.29.3 (ruling 255(10)/(11)(c)): a CUSTOMIZE job on bigdisk adds
  # `preflight` to its needs (v1.34; `schedule-guard` before) and
  # `(github.event_name != 'schedule' || needs.preflight.outputs.verdict == 'run')`
  # to its `if:`, so it skips on a schedule run while main is busy. One that
  # needs the image job skips with it already.
  # v1.30: the test is `needs.preflight.outputs.verdict == 'run'` on
  # every event, so the job skips on a proven main push and on a refused run,
  # and its check line in CI Gate is full, pr or code as before: the gate
  # reads a proven skip as passed. Its timeout-minutes is ceil(1.5 x its
  # 72-hour p95) (ci-standard.md §12).

  # v1.35.2 (Company Agent m2577): the commit signature gate is not a job of
  # this workflow. It is signatures.yml, on pull_request_target, so it runs
  # from the base branch and a pull request cannot edit the script that
  # judges it. Its `Signatures / Signatures` check is required by the ruleset
  # beside CI Gate. v1.35 and v1.35.1 ran it here as `signatures`.

  # trusted-imx95 (security finding on #19): the private-pattern scan is
  # releasability.yml, on pull_request_target, so the private pattern secret
  # never reaches a run of this file. This job reads that scan's result: the
  # newest commit status on the head commit whose context is
  # `Releasability / Releasability (pull_request_target)` on a pull request
  # and `Releasability / Releasability (push)` on any other event (Gitea
  # names an Actions status `<workflow> / <job> (<event>)`, as CI Gate's
  # `CI / CI Gate (schedule)` note says). The github.com mirror posts an
  # Actions job as a check run named after the job, `Releasability`. It
  # fails closed on any state but success, a missing status and an
  # unreadable API: a scan still running fails it, and re-running this job
  # once the scan is done reads it again. It needs lint so that it starts
  # late: the scan builds nothing and has usually ended by then. CI Gate
  # requires it as `always`. A pull request can edit this file, so the
  # ruleset also requires the Releasability context itself. When the base
  # commit has no releasability.yml (the bootstrap: the pull request that
  # adds it), no status can exist and this job passes with a notice; the
  # file's presence is read at the base through the API.
  releasability:
    name: Releasability [the private-pattern scan's status]
    runs-on: ubuntu-latest
    needs: [preflight, lint]
    if: ${{ always() && !github.event.pull_request.draft }}
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
      checks: read
    steps:
      - name: Read the head commit's Releasability status
        env:
          EVENT: ${{ github.event_name }}
          SERVER: ${{ github.server_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          GH_API: ${{ github.api_url }}/repos/${{ github.repository }}
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          tmp=${RUNNER_TEMP:-/tmp}
          if [ "$EVENT" = pull_request ]; then
            want="Releasability / Releasability (pull_request_target)"
          else
            want="Releasability / Releasability (push)"
          fi
          [ -n "$HEAD_SHA" ] || { echo "FAIL no head commit to read"; exit 1; }
          # The token reaches curl as a header from a file descriptor, never
          # on its command line.
          get() { # get <url> <file>: 0 on a 200 reply, saved in <file>
            [ "$(curl -sS --max-time 30 -o "$2" -w '%{http_code}' \
              -H @<(printf 'Authorization: token %s\n' "$JOB_TOKEN") "$1")" = 200 ]
          }
          # The requirement follows the base (Codex finding on #19):
          # pull_request_target loads releasability.yml from the base
          # branch, so a base without it posts no status. Whether the file
          # is there is read from the forge API at the base commit (a push
          # or schedule run: its own commit), never from the pull request's
          # tree, so a pull request that deletes the file still needs the
          # status. 404 is the bootstrap; any other reply but 200 fails.
          [ -n "$BASE_SHA" ] || { echo "FAIL no base commit to read"; exit 1; }
          if [ "$SERVER" = https://github.com ]; then
            wfurl="$GH_API/contents/.github/workflows/releasability.yml?ref=$BASE_SHA"
          else
            wfurl="$REPO_API/contents/.github/workflows/releasability.yml?ref=$BASE_SHA"
          fi
          code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H @<(printf 'Authorization: token %s\n' "$JOB_TOKEN") "$wfurl") || code=unreadable
          case $code in
            200) ;;
            404)
              echo "::notice::bootstrap: ${BASE_SHA:0:12} has no .github/workflows/releasability.yml, so no Releasability status can exist yet; the scan is required once it is on the base"
              echo "OK   bootstrap: no releasability.yml at ${BASE_SHA:0:12}"
              exit 0 ;;
            *)
              echo "FAIL whether ${BASE_SHA:0:12} has releasability.yml cannot be read ('$code')"
              exit 1 ;;
          esac
          if [ "$SERVER" = https://github.com ]; then
            want=Releasability
            get "$GH_API/commits/$HEAD_SHA/check-runs?check_name=Releasability&filter=latest" "$tmp/rel.json" \
              || { echo "FAIL the check runs of ${HEAD_SHA:0:12} cannot be read"; exit 1; }
            st=$(jq -r '[.check_runs[]? | select(.name == "Releasability")] | max_by(.id) | if . == null then "none" else (.conclusion // .status // "none") end' "$tmp/rel.json") || st=unreadable
          else
            get "$REPO_API/commits/$HEAD_SHA/statuses?sort=recentupdate&limit=50" "$tmp/rel.json" \
              || { echo "FAIL the commit statuses of ${HEAD_SHA:0:12} cannot be read"; exit 1; }
            st=$(jq -r --arg c "$want" '[.[]? | select(.context == $c)] | max_by(.id) | if . == null then "none" else (.status // .state // "none") end' "$tmp/rel.json") || st=unreadable
          fi
          if [ "$st" = success ]; then
            echo "OK   $want: success on ${HEAD_SHA:0:12}"
            exit 0
          fi
          echo "FAIL $want: '$st' on ${HEAD_SHA:0:12} (the Releasability workflow must pass on this commit; if it was still running, re-run this job once it ends)"
          exit 1

  # The single required check (devops.md §1). Every job above must appear in
  # BOTH the needs list and the results check — a gate that can pass vacuously
  # is worse than no gate. Do not use join(needs.*.result); it evaluates empty
  # on Gitea and reports success while jobs fail.
  # v1.21: on the ci-gate runners (Company Agent m386: only CI Gate runs there;
  # a 1-CPU gate runner cannot hold a stage). trivy and fips are in nightly.yml
  # (v1.9, devops.md §8a: the alpha regime).
  ci-gate:
    name: CI Gate
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ci-gate' }}
    # v1.29.3: on a schedule run the schedule guard decides. `busy` skips the
    # gate, so `CI / CI Gate (schedule)` posts `skipped` (Gitea 1.27.1 posts a
    # skipped job as `skipped`, not `success`), never a green nightly. Every
    # other verdict, an empty one included, runs it.
    if: ${{ always() && (github.event_name != 'schedule' || needs.preflight.outputs.verdict != 'busy') }}
    timeout-minutes: 5        # v1.30
    # CUSTOMIZE: the repo's job list. Add every CUSTOMIZE job here AND as a
    # check line below; remove none of the template's jobs. v1.30: lint
    # joins; publish-images is the one job outside the gate (see its comment).
    needs: [preflight, lint, history-scan, releasability, image, lint-gates, integration, soak]   # v1.34; v1.35.2 signatures.yml
    steps:
      - name: Fail closed on any non-success
        env:
          # The full tier is CI_FULL_TIER (v1.23): every event but a PR, and a
          # PR labelled ci:full. A job marked `full` may be skipped below only
          # when it is not selected; a `pr` job may never be skipped.
          FULL_TIER: ${{ env.CI_FULL_TIER }}
          # v1.24: a `nightly` job runs on schedule and workflow_dispatch only.
          NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          # v1.26: a draft PR runs no CI, so its gate fails rather than pass on skips.
          DRAFT: ${{ github.event.pull_request.draft == true }}
          # v1.29.3: the schedule guard's verdict on a schedule run.
          SCHEDULE: ${{ github.event_name == 'schedule' }}
          SCHEDULE_GUARD: ${{ needs.preflight.outputs.verdict }}
          # v1.30: the proving run of a proven main push, the docs-only PR
          # flag (a `code` job skips on it) and the lint-gates path scope (a
          # `scoped` job skips when no file matched).
          PROOF: ${{ needs.preflight.outputs.proof }}
          DOCS_ONLY: ${{ needs.preflight.outputs.docs_only == 'true' }}
          LINT_GATES_SEL: ${{ needs.preflight.outputs.lint_gates != 'false' }}
        run: |
          if [ "${DRAFT}" = true ]; then
            echo "FAIL draft pull request: no CI runs on a draft. Mark it ready, then push an empty commit to start its run."
            exit 1
          fi
          BAD=0
          echo "full tier selected: ${FULL_TIER}; nightly selected: ${NIGHTLY}"
          # trusted-imx95: an `always` job is never accepted skipped, not even
          # on a proven tree (the history secret scan, the releasability status).
          check() { # <job> <result> <always|pr|code|scoped|full|nightly>
            case "$2" in
              success) echo "OK   $1";;
              skipped)
                if [ "$3" = always ]; then
                  echo "FAIL $1 (skipped: it runs on every verdict, a proven tree included)"; BAD=1
                elif [ "${SCHEDULE_GUARD}" = proven ] && [ -n "${PROOF}" ] && [ "$3" != nightly ]; then
                  echo "SKIP $1 (tree proven by run ${PROOF})"
                elif [ "$3" = code ] && [ "${DOCS_ONLY}" = true ]; then
                  echo "SKIP $1 (docs-only pull request)"
                elif [ "$3" = scoped ] && [ "${LINT_GATES_SEL}" != true ]; then
                  echo "SKIP $1 (no changed file matches LINT_GATES_PATTERN)"
                elif [ "$3" = full ] && [ "${FULL_TIER}" != true ]; then
                  echo "SKIP $1 (full tier not selected)"
                elif [ "$3" = nightly ] && [ "${NIGHTLY}" != true ]; then
                  echo "SKIP $1 (nightly and dispatch only)"
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 ($2)"; BAD=1;;
            esac
          }
          # v1.29.3: a schedule run reaches this step on any verdict but
          # `busy`. Any verdict but `run` means its bigdisk jobs skipped
          # because the guard had no count: fail closed.
          # v1.30: a refused run (a dispatch off main, a checkpoint-branch PR) fails.
          if [ "${SCHEDULE_GUARD}" = refused ]; then
            echo "FAIL schedule-guard (refused: a workflow_dispatch off main or a PR from lane-ckpt/*; see its log)"; BAD=1
          fi
          if [ "${SCHEDULE}" = true ] && [ "${SCHEDULE_GUARD}" != run ]; then
            echo "FAIL schedule-guard (verdict '${SCHEDULE_GUARD:-none}': the bigdisk jobs skipped because the guard could not read the API; see its log)"; BAD=1
          fi
          # CUSTOMIZE: one line per job in needs above. A job gated to the
          # full tier by its `if:` is marked full, one gated to schedule and
          # workflow_dispatch is nightly; every other job is pr. v1.30: a job
          # that skips on a docs-only PR is code, and lint-gates is scoped.
          check preflight   "${{ needs.preflight.result }}" pr
          check lint        "${{ needs.lint.result }}" pr
          check history-scan "${{ needs.history-scan.result }}" always
          check releasability "${{ needs.releasability.result }}" always
          check image       "${{ needs.image.result }}" code
          check lint-gates  "${{ needs.lint-gates.result }}" scoped
          check integration "${{ needs.integration.result }}" full
          check soak        "${{ needs.soak.result }}" nightly
          exit $BAD
